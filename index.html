  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #0a0805;
      color: white;
      font-family: 'Tajawal', 'sans-serif';
      overflow-x: hidden;
    }

    html {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #0a0805;
    }

    /* App shell: full dynamic viewport height (fixes mobile black/cut-off bars) */
    .app-shell {
      height: 100vh;
      height: 100dvh;
      width: 100vw;
    }

    /* Ensure content always scrolls inside mobile browsers */
    #root {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .game-bg-main {
      background-image: url('https://i.ibb.co/kWJRhSN/1000126060.png');
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
    }

    .glass-card {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 0, 0, 0.25);
    }

    .red-neon-text {
      color: #ff0000;
      text-shadow: 0 0 15px rgba(255, 0, 0, 0.9);
    }

    .red-neon-border {
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
      border: 1px solid rgba(255, 0, 0, 0.6);
    }

    /* Professional Square Button Styling */
    .premium-square-btn {
      background: #ff0000;
      color: #000000;
      position: relative;
      overflow: hidden;
      border-radius: 1.5rem;
      /* Slight rounded for modern Look but still square-ish */
      box-shadow: 0 15px 40px rgba(255, 0, 0, 0.35);
      transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .premium-square-btn:hover {
      transform: scale(1.05) translateY(-5px);
      box-shadow: 0 20px 60px rgba(255, 0, 0, 0.5);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .premium-square-btn:active {
      transform: scale(0.95);
    }

    /* Gloss effect that moves DOWN on hover */
    .premium-square-btn .shine-layer {
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom,
          transparent,
          rgba(255, 255, 255, 0.6),
          transparent);
      pointer-events: none;
      z-index: 1;
    }

    .premium-square-btn:hover .shine-layer {
      animation: shine-down 0.7s forwards;
    }

    /* Fixed gloss corner like the image */
    .btn-static-gloss {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 40%);
      pointer-events: none;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(10, 8, 5, 0.55);
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #e8be6e, #a97a30);
      border-radius: 99px;
      border: 3px solid transparent;
      background-clip: padding-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #f9e0a4, #c9962f);
      background-clip: padding-box;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(232, 190, 110, 0.32);
      border-radius: 99px;
    }

    button span {
      background: transparent !important;
      -webkit-background-clip: padding-box;
      background-clip: padding-box;
    }
  </style>
