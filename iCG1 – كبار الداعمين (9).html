<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iCG1 – كبار الداعمين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0806;--p1:#17110b;--p2:#0f0b08;--line:rgba(214,170,106,.2);--gold:#d6aa6a;--champ:#f6e3b8;--text:#f5ede1;--mute:#9d8f7a;--kick:#53fc18;--week:#ff5d7a;--month:#35d6e0;--f:"Tajawal",Tahoma,Arial,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;font-family:var(--f);color:var(--text);line-height:1.5;background:radial-gradient(1000px 520px at 50% -8%,#33220f 0,transparent 70%),var(--bg);overflow-x:hidden}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--champ);outline-offset:3px}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:34px 16px 70px;display:grid;gap:42px}
.frame{position:relative;border-radius:26px;background:linear-gradient(180deg,var(--p1),var(--p2));isolation:isolate}
.frame::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;z-index:-1;background:linear-gradient(160deg,var(--b1,#f6e3b8),var(--b2,rgba(214,170,106,.1)) 45%,var(--b3,rgba(214,170,106,.5)));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

/* Kick hero */
.kick{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);overflow:hidden;--b1:#8dff5e}
.kick::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:radial-gradient(380px 260px at 100% 50%,rgba(83,252,24,.14),transparent 70%),repeating-linear-gradient(115deg,transparent 0 22px,rgba(214,170,106,.035) 22px 23px)}
.k-main{padding:32px;display:grid;gap:16px}
.k-top{display:flex;align-items:center;gap:16px}
.k-logo{width:84px;height:84px;flex:none;filter:drop-shadow(0 0 18px rgba(83,252,24,.35)) drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.klogo{display:block;width:100%;height:100%}
.live{display:inline-flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--kick);box-shadow:0 0 10px var(--kick);animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.3}}
.k-num{font:900 78px/.95 var(--f);background:linear-gradient(180deg,#fff4d6,#d6aa6a);-webkit-background-clip:text;background-clip:text;color:transparent}
.k-num small{display:block;margin-top:8px;font:500 16px var(--f);color:var(--mute);-webkit-text-fill-color:var(--mute)}
.goal{display:grid;gap:7px;font-size:13px;color:var(--mute)}
.goal div{display:flex;justify-content:space-between}
.goal b{color:var(--champ)}
.gb{height:8px;border-radius:8px;background:#261c12;overflow:hidden}
.gb i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(270deg,#53fc18,#d6aa6a);transition:width 1.6s cubic-bezier(.2,.7,.2,1) .3s;position:relative;overflow:hidden}
.gb i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55),transparent 70%);animation:sh 2.4s infinite}
@keyframes sh{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 28px;border-radius:14px;font:800 15px var(--f);color:#241708;text-decoration:none;background:linear-gradient(180deg,#f6e3b8,#c4955a);border:0;cursor:pointer;box-shadow:0 10px 26px rgba(214,170,106,.28);transition:transform .15s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.65),transparent 65%);transform:translateX(120%);animation:sh2 3.2s infinite}
@keyframes sh2{0%,60%{transform:translateX(120%)}100%{transform:translateX(-120%)}}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:var(--p1);color:var(--champ);border:1px solid var(--line);box-shadow:none}
.k-acts{display:flex;gap:10px;flex-wrap:wrap}
.ladder{padding:30px 28px;border-inline-start:1px solid var(--line);display:grid;align-content:center;gap:22px}
.ladder h3{margin:0;font:800 18px var(--f)}
.ladder h3 span{color:var(--mute);font-weight:400;font-size:14px;margin-inline-start:8px}
.steps{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.steps::before{content:"";position:absolute;top:35px;inset-inline:8%;height:3px;border-radius:3px;background:linear-gradient(270deg,#b8bec6,#e8c52b,#d32ae6,#ff4457,#2fe6d0,#8f7bff);opacity:.45}
.step{position:relative;display:grid;justify-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0}
.med{position:relative;width:72px;height:72px;border-radius:22px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 25%,color-mix(in srgb,var(--g) 30%,#1c140c),#0e0a07 78%);border:1.5px solid color-mix(in srgb,var(--g) 38%,transparent);box-shadow:0 12px 24px -10px color-mix(in srgb,var(--g) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.09);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s}
.med::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28),transparent 65%);transform:translateX(130%);transition:transform .7s}
.step:hover .med::after,.step.on .med::after{transform:translateX(-130%)}
.med img{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.65))}
.step b{font:800 13px var(--f);color:var(--mute);transition:color .2s}
.step:hover .med{transform:translateY(-4px)}
.step.on .med{transform:translateY(-6px) scale(1.08);border-color:var(--g);box-shadow:0 0 0 3px color-mix(in srgb,var(--g) 24%,transparent),0 20px 38px -10px var(--g)}
.step.on b{color:var(--g)}
.show{position:relative;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:18px;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--g) 17%,#15100b),#0f0b08 85%);border:1px solid color-mix(in srgb,var(--g) 45%,transparent);animation:pop .45s cubic-bezier(.2,.8,.2,1)}
.show::after{content:"";position:absolute;inset-inline-start:-40px;top:-40px;width:200px;height:200px;background:radial-gradient(circle,color-mix(in srgb,var(--g) 28%,transparent),transparent 70%);pointer-events:none}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.big{position:relative;z-index:1;width:108px;height:108px;border-radius:28px;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,color-mix(in srgb,var(--g) 38%,#1c140c),#0e0a07 78%);border:1.5px solid var(--g);box-shadow:0 0 44px -6px var(--g)}
.big img{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))}
.sx{position:relative;z-index:1;display:grid;gap:6px}
.sx small{color:var(--g);font:800 12px var(--f);letter-spacing:.4px}
.sx h4{margin:0;font:900 24px var(--f)}
.sx p{margin:0;color:var(--mute);font-size:14px}
.lv{display:flex;gap:5px;margin-top:4px}
.lv i{height:6px;flex:1;border-radius:4px;background:#2a2016}
.lv i.f{background:var(--g);box-shadow:0 0 10px color-mix(in srgb,var(--g) 60%,transparent)}
.lvt{font-size:12px;color:var(--mute)}.lvt b{color:var(--text)}

/* heading + tools */
.head{text-align:center;display:grid;gap:8px;justify-items:center}
.head h2{margin:0;font:900 clamp(36px,6vw,56px)/1.1 var(--f);background:linear-gradient(100deg,#d6aa6a 20%,#fff4d6 45%,#d6aa6a 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gl 5s linear infinite}
@keyframes gl{to{background-position:-220% 0}}
.head p{margin:0;color:var(--mute)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sm{padding:16px;text-align:center}
.sm b{display:block;font:900 32px/1.1 var(--f);color:var(--champ)}
.sm span{color:var(--mute);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:10px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:10px;padding:0 16px;height:48px;border-radius:14px;background:var(--p1);border:1px solid var(--line)}
.search:focus-within{border-color:var(--gold)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px}
.search svg{width:18px;height:18px;color:var(--mute)}

/* cards */
.three{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:stretch}
.card{--ac:var(--week);position:relative;padding:28px 26px 16px;display:grid;gap:18px;align-content:start;--b1:var(--ac);--b3:color-mix(in srgb,var(--ac) 45%,transparent);overflow:hidden;transition:transform .15s}
.card.month{--ac:var(--month)}
.card.best{grid-column:1/-1;padding:30px 30px 18px;gap:20px;--ac:#f6e3b8;--b3:rgba(246,227,184,.8);box-shadow:0 30px 70px -26px rgba(214,170,106,.45)}
.card::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:radial-gradient(280px 220px at var(--mx,50%) var(--my,0),color-mix(in srgb,var(--ac) 24%,transparent),transparent 70%)}
.ch{display:flex;align-items:center;gap:12px}
.ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--ac);color:#160f08;flex:none;box-shadow:0 8px 22px color-mix(in srgb,var(--ac) 35%,transparent)}
.ic svg{width:24px;height:24px}
.ch h3{margin:0;font:900 28px var(--f)}.ch p{margin:0;color:var(--mute);font-size:13px}
.lead{display:grid;justify-items:center;text-align:center;gap:2px;padding:4px 0 8px;background:none;border:0;cursor:pointer;width:100%;transition:transform .25s}
.lead:hover,.lead.hl{transform:scale(1.03)}
.crown{width:40px;height:40px;color:var(--ac);animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 4px 14px color-mix(in srgb,var(--ac) 60%,transparent))}
@keyframes fl{50%{transform:translateY(-5px)}}
.ring{width:142px;height:142px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 0deg,var(--ac),transparent 35%,var(--ac) 60%,transparent 85%,var(--ac));animation:rot 7s linear infinite;box-shadow:0 0 40px color-mix(in srgb,var(--ac) 25%,transparent)}
@keyframes rot{to{transform:rotate(360deg)}}
.ring .av{animation:rot 7s linear infinite reverse}
.av{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;font:900 50px var(--f);color:#160f08;background:var(--ac);box-shadow:0 0 0 5px var(--p2)}
.ln{font:900 26px var(--f);margin-top:12px;word-break:break-all}
.lc{display:flex;align-items:baseline;gap:8px;color:var(--mute);font-size:14px}
.lc b{font:900 64px/1 var(--f);color:var(--ac)}
.rows{display:grid}
.row{position:relative;display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:14px;padding:16px 10px;border-radius:14px;cursor:pointer;background:none;border:0;text-align:start;width:100%;transition:background .25s,opacity .3s,transform .25s}
.row+.row,.rows{border-top:1px solid rgba(214,170,106,.12)}
.row:hover,.row.hl{background:color-mix(in srgb,var(--ac) 13%,transparent);transform:translateX(-4px)}
.rk{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:800 17px var(--f);background:#241b12;color:var(--champ);border:1px solid var(--line)}
.r2 .rk{background:linear-gradient(180deg,#e2e2e2,#8c8c8c);color:#1a1a1a;border:0}
.r3 .rk{background:linear-gradient(180deg,#dca06a,#86552f);color:#1d1208;border:0}
.nm{font-weight:800;font-size:18px;word-break:break-all}
.bar{height:5px;border-radius:5px;background:#261c12;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:5px;background:var(--ac);transition:width 1.1s cubic-bezier(.2,.7,.2,1) .3s}
.ct{font:800 22px var(--f)}.ct small{font-weight:400;font-size:12px;color:var(--mute);margin-inline-start:4px}
/* podium inside best card */
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:end;padding:6px 0 0;width:100%;max-width:680px;margin:0 auto}
.card.best .rows{display:grid;grid-template-columns:1fr 1fr;column-gap:26px}
.card.best .row+.row{border-top:0}
.pp{display:grid;justify-items:center;text-align:center;cursor:pointer;background:none;border:0;padding:0;min-width:0;transition:opacity .3s,filter .3s}
.pp .av{width:78px;height:78px;font-size:32px;background:var(--pc);box-shadow:0 0 0 3px var(--p2),0 0 0 5px color-mix(in srgb,var(--pc) 55%,transparent);transition:transform .3s}
.pp:hover .av{transform:scale(1.08) rotate(-4deg)}
.pp.p1 .av{width:104px;height:104px;font-size:44px}
.pp .crown{width:42px;height:42px;color:var(--pc)}
.pn{font:800 18px var(--f);margin-top:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc{color:var(--mute);font-size:14px;margin-bottom:8px}.pc b{color:var(--pc);font:900 28px var(--f);margin-inline-end:3px}
.ped{width:100%;display:grid;place-items:start center;padding-top:8px;border-radius:14px 14px 0 0;font:900 44px/1 var(--f);color:rgba(22,15,8,.55);background:linear-gradient(180deg,var(--pc),color-mix(in srgb,var(--pc) 30%,#0f0b08));transform:scaleY(0);transform-origin:bottom;transition:transform 1s cubic-bezier(.2,.8,.2,1) var(--d)}
.card.in .ped{transform:scaleY(1)}
.dim{opacity:.22;filter:grayscale(1)}

/* split: leader right, others left */
.split{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.2fr);align-items:center}
.split .lead{padding:6px 8px 6px 18px;align-content:center;position:relative}
.split .lead::after{content:"";position:absolute;inset-block:6px;inset-inline-end:0;width:1px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--ac) 55%,transparent),transparent)}
.split .ring{width:122px;height:122px}
.split .av{width:100px;height:100px;font-size:42px}
.split .ln{font-size:22px}
.split .lc b{font-size:54px}
.split .rows{border-top:0;padding-inline-start:18px}
.split .row{padding:13px 6px;gap:12px;grid-template-columns:36px 1fr auto}
.split .rk{width:36px;height:36px;font-size:15px}
.split .nm{font-size:16px}
.split .ct{font-size:20px}
@media(max-width:560px){.split{grid-template-columns:1fr}.split .lead{padding:4px 0 14px}.split .lead::after{inset-block:auto 0;inset-inline:0;height:1px;width:auto}.split .rows{padding-inline-start:0;margin-top:6px}}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,3,2,.82);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px}
.ov.on{display:flex}
.md{width:100%;max-width:520px;padding:26px;display:grid;gap:18px;text-align:center;animation:up .35s cubic-bezier(.2,.7,.2,1);max-height:100%;overflow:auto}
@keyframes up{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.md .av{margin:0 auto;width:90px;height:90px;font-size:40px}
.md h3{margin:0;font:900 28px var(--f);word-break:break-all}
.bdg{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:999px;font:800 13px var(--f);border:1px solid var(--line);color:var(--champ)}
.st{display:grid;gap:10px;text-align:start}
.st .l{display:flex;justify-content:space-between;font-size:14px;color:var(--mute)}
.st .l b{color:var(--text)}
.x{position:absolute;inset-block-start:14px;inset-inline-start:14px;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--p1);cursor:pointer;display:grid;place-items:center}
.x svg{width:16px;height:16px}
.toast{position:fixed;inset-inline:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;padding:10px 20px;border-radius:12px;background:var(--champ);color:#241708;font-weight:800;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
@media(max-width:860px){.kick{grid-template-columns:1fr}.ladder{border-inline-start:0;border-top:1px solid var(--line);padding:26px 16px}.k-main{padding:26px 20px}.k-num{font-size:62px}.three{grid-template-columns:1fr}.card.best{grid-column:auto;padding:24px 16px 12px}.card.best .rows{grid-template-columns:1fr}.card{padding:22px 16px 12px}.pg{gap:8px}.pp .av{width:56px;height:56px;font-size:24px}.pp.p1 .av{width:76px;height:76px;font-size:32px}.pn{font-size:14px}.ped{font-size:32px}.lc b{font-size:52px}.hex{width:44px;height:44px;font-size:20px}.steps::before{top:22px}.step b{font-size:11px}.sum{gap:8px}.sm b{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.ped{transform:none}}

/* plain background */
body{background:#0b0806}
.kick{background:var(--p1)}
.kick::after{display:none}
@media(max-width:860px){.med{width:46px;height:46px;border-radius:14px}.med img{width:36px;height:36px}.steps::before{top:22px}.step b{font-size:11px}.show{grid-template-columns:1fr;justify-items:center;text-align:center}.sx{justify-items:center}.lv{width:100%}.big{width:92px;height:92px}.sx h4{font-size:21px}}
</style>
</head>
<body>
<main class="wrap">

<section class="kick frame rv">
  <div class="k-main">
    <div class="k-top"><div class="k-logo"><svg class="klogo" viewBox="0 0 18 18" shape-rendering="crispEdges" aria-hidden="true"><path fill="#0a0e0f" d="M4 0h10v1h-10zM3 1h12v1h-12zM3 2h12v1h-12zM1 3h16v1h-16zM0 4h18v1h-18zM0 5h18v1h-18zM0 6h18v1h-18zM0 7h18v1h-18zM0 8h18v1h-18zM0 9h18v1h-18zM0 10h18v1h-18zM0 11h18v1h-18zM0 12h18v1h-18zM0 13h18v1h-18zM1 14h16v1h-16zM3 15h12v1h-12zM3 16h12v1h-12zM4 17h10v1h-10z"/><path fill="#53fc18" d="M5 4h3v1h-3zM10 4h3v1h-3zM5 5h3v1h-3zM9 5h4v1h-4zM5 6h8v1h-8zM5 7h7v1h-7zM5 8h6v1h-6zM5 9h7v1h-7zM5 10h8v1h-8zM5 11h3v1h-3zM9 11h4v1h-4zM5 12h3v1h-3zM10 12h3v1h-3z"/></svg></div><span class="live"><i></i>القناة الرسمية على كيك</span></div>
    <div class="k-num"><span data-n="1114">0</span><small>متابع</small></div>
    <div class="goal"><div><span>الهدف القادم: <b id="gt">1,500</b> متابع</span><b id="gp">74%</b></div><div class="gb"><i id="gbar" data-w="74"></i></div></div>
    <div class="k-acts"><a class="btn" href="#">تابع الآن</a><button class="btn ghost" id="sub" type="button">أهدِ اشتراكاً</button></div>
  </div>
  <div class="ladder">
    <h3>شارات المشتركين<span>اضغط على أي شارة</span></h3>
    <div class="steps" id="steps"></div>
    <div id="binfo"></div>
  </div>
</section>

<section>
  <div class="head rv"><h2>كبار الداعمين</h2><p>أكثر من أهدوا اشتراكات للبث. اضغط على أي داعم لتشوف إحصائياته.</p></div>
  <div class="sum" style="margin-top:26px" id="sum"></div>
  <div class="tools rv" style="margin-top:16px"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="ابحث عن داعم بالاسم" aria-label="بحث عن داعم"></label></div>
  <div class="three" id="three" style="margin-top:18px"></div>
  </section>
</main>
<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="md frame" id="md"></div></div>
<div class="toast" id="toast"></div>

var BADGES=[
{m:1,n:"شهر واحد",g:"#b8bec6",t:"الشارة الأساسية",d:"أول شارة بعد الاشتراك، بداية رحلتك مع القناة."},
{m:2,n:"شهران",g:"#e8c52b",t:"الشارة الذهبية",d:"شهران متتاليان من الدعم، وتتحول شارتك للذهبي."},
{m:3,n:"3 أشهر",g:"#d32ae6",t:"الشارة البنفسجية",d:"ثلاثة أشهر من الوفاء، شارة بنفسجية لامعة."},
{m:6,n:"6 أشهر",g:"#ff4457",t:"الشارة الحمراء",d:"نصف سنة مع القناة، شارة حمراء قوية."},
{m:9,n:"9 أشهر",g:"#2fe6d0",t:"شارة الزمرد",d:"تسعة أشهر من الولاء، بلون الزمرد المتوهج."},
{m:12,n:"سنة كاملة",g:"#8f7bff",t:"أعلى شارة",d:"اشتراك لسنة كاملة، أعلى شارة في القناة."}];
/* badges */
var IM=function(m){return '<img alt="شارة '+m+'" src="data:image/png;base64,'+IMG[m]+'">'};
$("steps").innerHTML=BADGES.map(function(b,i){return '<button class="step" data-b="'+i+'" style="--g:'+b.g+'" aria-label="شارة '+b.n+'"><div class="med">'+IM(b.m)+'</div><b>'+b.m+'M</b></button>'}).join("");
function badge(i){var b=BADGES[i];
 document.querySelectorAll(".step").forEach(function(s,j){s.classList.toggle("on",i===j)});
 $("binfo").innerHTML='<div class="show" style="--g:'+b.g+'"><div class="big">'+IM(b.m)+'</div><div class="sx"><small>'+b.t+'</small><h4>شارة '+b.n+'</h4><p>'+b.d+'</p><div class="lv">'+BADGES.map(function(_,j){return '<i class="'+(j<=i?"f":"")+'"></i>'}).join("")+'</div><span class="lvt">المستوى <b>'+(i+1)+'</b> من '+BADGES.length+'</span></div></div>'}
badge(5);

/* summary */
var all={};Object.keys(P).forEach(function(k){P[k].forEach(function(x){all[x[0]]=all[x[0]]||{};all[x[0]][k]=x[1]})});
var users=Object.keys(all),best=P.best;
var sumG=function(L){return L.reduce(function(s,x){return s+x[1]},0)},BT=sumG(best);
$("sum").innerHTML=[[BT,"إجمالي الهدايا"],[users.length,"داعمين"],[best[0][1],"أكبر عدد هدايا لداعم"]].map(function(a,i){return '<div class="sm frame rv" style="--d:'+i*.1+'s"><b data-n="'+a[0]+'">0</b><span>'+a[1]+'</span></div>'}).join("");

/* cards */
var ICONS={week:ICON.week,month:ICON.month,best:CROWN};
var PC=["#f6e3b8","#d9d9d9","#dca06a"];
function card(k,ci){
 var L=P[k],tot=sumG(L),mx=L[0][1],t=L[0],isB=k==="best";
 var head='<div class="ch"><div class="ic">'+ICONS[k]+'</div><div><h3>'+NAMES[k]+'</h3><p>'+tot+' هدية · '+L.length+' داعم</p></div></div>';
 var mid,start;
 if(isB){
  var ord=[2,0,1],hh=[140,100,74];
  mid='<div class="pg">'+ord.map(function(ix){var u=L[ix],r=ix+1;return '<button class="pp p'+r+'" data-u="'+u[0]+'" style="--pc:'+PC[ix]+'">'+(r===1?'<div class="crown">'+CROWN+'</div>':'')+'<div class="av">'+u[0][0].toUpperCase()+'</div><div class="pn">'+u[0]+'</div><div class="pc"><b>'+u[1]+'</b>هدية</div><div class="ped" style="height:'+hh[ix]+'px;--d:'+(.3+(2-ix)*.25)+'s">'+r+'</div></button>'}).join("")+'</div>';
  start=3;
 }else{
  mid='<button class="lead" data-u="'+t[0]+'"><div class="crown">'+CROWN+'</div><div class="ring"><div class="av">'+t[0][0].toUpperCase()+'</div></div><div class="ln">'+t[0]+'</div><div class="lc"><b>'+t[1]+'</b>هدية</div></button>';
  start=1;
 }
 var rows=L.slice(start).map(function(x,i){var r=i+start+1;return '<button class="row r'+r+'" data-u="'+x[0]+'"><div class="rk">'+r+'</div><div><div class="nm">'+x[0]+'</div><div class="bar"><i data-w="'+(x[1]/mx*100)+'"></i></div></div><div class="ct">'+x[1]+'<small>هدية</small></div></button>'}).join("");
 return '<article class="card frame tilt rv '+k+'" style="--d:'+ci*.12+'s">'+head+(isB?mid+(rows?'<div class="rows">'+rows+'</div>':''):'<div class="split">'+mid+'<div class="rows">'+rows+'</div></div>')+'</article>';
}
$("three").innerHTML=["best","week","month"].map(card).join("");

/* linked highlight + search */
function hl(u,on){document.querySelectorAll("[data-u]").forEach(function(e){e.classList.toggle("hl",on&&e.dataset.u===u)})}
document.addEventListener("mouseover",function(e){var t=e.target.closest("[data-u]");if(t)hl(t.dataset.u,true)});
document.addEventListener("mouseout",function(e){var t=e.target.closest("[data-u]");if(t)hl(t.dataset.u,false)});
$("q").addEventListener("input",function(e){var q=e.target.value.trim().toLowerCase();document.querySelectorAll("[data-u]").forEach(function(el){el.classList.toggle("dim",!!q&&el.dataset.u.toLowerCase().indexOf(q)<0)})});

/* modal */
function who(u){
 var d=all[u],tot=Object.keys(d).length?d.best||0:0,i=best.map(function(x){return x[0]}).indexOf(u)+1;
 var rows=["week","month","best"].map(function(k){var ix=P[k].map(function(x){return x[0]}).indexOf(u),g=d[k]||0;var mx=P[k][0][1];
  return '<div><div class="l"><span>'+NAMES[k]+'</span><b>'+(g?g+' هدية · المركز '+(ix+1):'لا يوجد')+'</b></div><div class="bar"><i style="width:'+(g/mx*100)+'%;background:'+({week:"var(--week)",month:"var(--month)",best:"var(--champ)"})[k]+'"></i></div></div>'}).join("");
 $("md").innerHTML='<button class="x" data-x aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="av" style="--ac:'+(i===1?"#f6e3b8":i===2?"#d4d4d4":"#dca06a")+'">'+u[0].toUpperCase()+'</div><div><h3>'+u+'</h3><span class="bdg">المركز '+i+' في الأفضل · '+Math.round(tot/BT*100)+'% من الهدايا</span></div><div class="st">'+rows+'</div><button class="btn" data-share>شارك الترتيب</button>';
 $("md").dataset.u=u;$("ov").classList.add("on");document.body.style.overflow="hidden";
 setTimeout(function(){},0)
}
function closeM(){$("ov").classList.remove("on");document.body.style.overflow=""}
document.addEventListener("click",function(e){
 if(e.target===$("ov"))return closeM();
 var t=e.target.closest("[data-u],[data-x],[data-share],[data-b],#sub");if(!t)return;
 if(t.dataset.b)return badge(+t.dataset.b);
 if(t.hasAttribute("data-x"))return closeM();
 if(t.id==="sub")return toast("سيتم فتح صفحة الاشتراك على كيك");
 if(t.hasAttribute("data-share")){var u=$("md").dataset.u;try{navigator.clipboard.writeText(u+" من كبار داعمي iCG1").then(function(){toast("تم النسخ")},function(){toast("تعذّر النسخ")})}catch(_){toast("تعذّر النسخ")}return}
 if(t.dataset.u)who(t.dataset.u);
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeM()});

/* count-up + reveal */
function cu(el){var n=+el.dataset.n,t0=null;function s(t){t0=t0||t;var p=Math.min(1,(t-t0)/1400);el.textContent=fmt(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(s)}requestAnimationFrame(s)}
var io=new IntersectionObserver(function(es){es.forEach(function(en){if(!en.isIntersecting)return;var el=en.target;el.classList.add("in");el.querySelectorAll("[data-n]").forEach(cu);if(el.dataset.n)cu(el);el.querySelectorAll("[data-w]").forEach(function(b){b.style.width=b.dataset.w+"%"});io.unobserve(el)})},{threshold:.15});
document.querySelectorAll(".rv").forEach(function(e){io.observe(e)});

/* tilt + spotlight */
document.querySelectorAll(".tilt").forEach(function(c){
 c.addEventListener("pointermove",function(e){if(e.pointerType==="touch")return;var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty("--mx",x*100+"%");c.style.setProperty("--my",y*100+"%");c.style.transform="perspective(900px) rotateY("+(x-.5)*-6+"deg) rotateX("+(y-.5)*6+"deg)"});
 c.addEventListener("pointerleave",function(){c.style.transform=""})});

</script>
