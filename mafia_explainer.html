*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fbeccb;font:700 32px/1.6 Tajawal,Tahoma,sans-serif}
:root{--dsp:"Baloo Bhaijaan 2",Tajawal,sans-serif;--gold:#e8be6e}
#fr{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#07060b}
.bg{position:absolute;inset:0;background:center/cover;opacity:0;transition:opacity 1.6s ease}.bg.on{opacity:1}
.bm{background-image:var(--bgm)}.bd{background-image:var(--bgd)}.be{background-image:var(--bge)}.bt{background-image:var(--bgt)}.bj{background-image:var(--bgj)}
.bn{background:radial-gradient(70% 60% at 30% 60%,#3a1030,transparent 70%),radial-gradient(70% 60% at 75% 40%,#10243f,transparent 70%),#07060b;opacity:1}
.vig{position:absolute;inset:0;background:radial-gradient(90% 80% at 50% 50%,transparent 45%,#000a);pointer-events:none}.dim{background:#07060b99}
.dust{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(3px 3px at 10% 80%,#ffd98aaa 50%,transparent),radial-gradient(4px 4px at 30% 60%,#ffd98a88 50%,transparent),radial-gradient(3px 3px at 55% 85%,#ffd98aaa 50%,transparent),radial-gradient(4px 4px at 72% 70%,#ffd98a77 50%,transparent),radial-gradient(3px 3px at 90% 90%,#ffd98aaa 50%,transparent),radial-gradient(3px 3px at 45% 40%,#ffd98a66 50%,transparent);animation:dust 12s ease-in-out infinite alternate}
@keyframes dust{from{transform:translateY(20px);opacity:.4}to{transform:translateY(-50px);opacity:1}}

role("mafia","m",13,"فريق المافيا","غرفة المافيا السرية","تتشاورون في الدردشة السرية مع زميلكم وتختارون ضحية واحدة. إذا اتفقتم ينتهي الوقت مبكراً.","تظاهر بأنك مواطن بريء، دافع عن نفسك واتهم غيرك.","تفوز عندما يصير عدد المافيا مساوياً لعدد الباقين أو أكثر.","لا تقتلوا الأقوياء فقط… ولا تتسرعوا بالدفاع عن بعضكم."),
role("citizen","m",10,"فريق المواطنين","لا فعل ليلي","أنت نائم. لا شيء تفعله في الليل.","ناقش، حلّل كلام الآخرين، وصوّت على من تظنه من المافيا.","تفوز عندما تُقصى المافيا كلها.","راقب من يتكلم كثيراً… ومن يسكت كثيراً."),
role("doctor","d",12,"فريق المواطنين","الحماية","تختار لاعباً واحداً تحميه. إذا اختاره القاتل تفشل العملية وينجو. ويمكنك حماية نفسك.","ناقش كمواطن عادي ولا تكشف دورك بسهولة.","تفوز مع المواطنين عند القضاء على المافيا.","غيّر من تحميه، فالمافيا قد تتوقع اختيارك."),
role("elder","e",13,"فريق المواطنين","إسكات أو تحقيق","تختار: إما إسكات لاعب فلا يتكلم في نقاش اليوم التالي، أو التحقيق مع لاعب لمرة واحدة فقط في اللعبة فتعرف إن كان من المافيا.","ما عندك دليل، فأقنع القرية بكلامك.","تفوز مع المواطنين عند القضاء على المافيا.","تحقيقك الوحيد ثمين… اختر شخصاً تشك فيه فعلاً."),
role("detective","t",14,"فريق المواطنين","التحقيق","تحقق مع لاعب واحد كل ليلة (ولا تكرر نفس اللاعب). النتيجة تصلك وحدك وتُحفظ في ملاحظاتك: «مافيا» أو «بريء» أو «مشبوه».","لا دليل عندك، فعليك الإقناع بالكلام. وقد تقول لك المافيا إنك تكذب!","تفوز مع المواطنين عند القضاء على المافيا.","إن كشفت نفسك بدري قتلتك المافيا، وإن سكتَّ ضاعت معلوماتك!"),
role("joker","j",14,"فريق الجوكر (وحده)","لا فعل ليلي","أنت نائم. وإذا قتلتك المافيا فلا يحدث شيء: تموت كمواطن عادي.","تصرّف بطريقة مشبوهة ليصوّت عليك الناس!","تفوز وحدك إذا طُردت بالتصويت: تنتهي اللعبة فوراً.","كن مشبوهاً… لكن لا تبالغ فينتبهوا لخطتك!"),
{bg:"t",t:15,ttl:"المحقق والجوكر",h:`<section class="sc"><div class="ctr"><h1 class="h1 rv" style="--c:#ff9248">المحقق والجوكر: كيف يتفاعلان؟</h1><table>${[["المحقق يحقق مع الجوكر","يظهر «مشبوه» 🃏"],["المحقق يحقق مع لاعب مافيا","يظهر «مافيا» 🔪"],["الشايب يحقق مع الجوكر","يظهر «ليس من المافيا»"],["الدكتور يحمي الجوكر","ينجو من القتل"],["الشايب يُسكِت الجوكر","لا يستطيع الكلام ذلك النهار"],["المحقق يقول «فلان مشبوه»","قد تصوّت القرية عليه فيفوز الجوكر!"]].map((r,i)=>`<tr class="rv" style="--d:${.5+i*.7}s"><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table></div></section>`},

];
const sc=document.getElementById("scs"),bar=document.getElementById("bar"),BGS={m:"bm",d:"bd",e:"be",t:"bt",j:"bj",n:"b0"};
sc.innerHTML=S.map(s=>s.h).join("");const els=[...sc.children];bar.innerHTML=S.map((s,i)=>`<i data-i="${i}"><b></b></i>`).join("");
let cur=-1,tm=0,play=false,t0=0,raf=0;
function show(i){i=Math.max(0,Math.min(S.length-1,i));cur=i;els.forEach((e,k)=>e.classList.toggle("on",k===i));Object.values(BGS).forEach(id=>document.getElementById(id).classList.remove("on"));document.getElementById(BGS[S[i].bg]).classList.add("on");document.getElementById("b0").classList.add("on");
 [...bar.children].forEach((b,k)=>{b.classList.toggle("d",k<i);b.firstChild.style.width=k<i?"100%":"0"});document.getElementById("ttl").textContent=(i+1)+"/"+S.length+" · "+S[i].ttl;t0=performance.now();els[i].querySelectorAll(".f").forEach(f=>{f.style.animation="none";void f.offsetWidth;f.style.animation=""});}
function loop(now){if(play){const p=(now-t0)/1000/S[cur].t;bar.children[cur].firstChild.style.width=Math.min(100,p*100)+"%";if(p>=1){if(cur<S.length-1)show(cur+1);else play=false}}raf=requestAnimationFrame(loop)}
const next=()=>show(cur+1),prev=()=>show(cur-1);
document.getElementById("go").onclick=()=>{document.getElementById("intro").classList.add("x");play=true;show(0)};
document.getElementById("bn").onclick=()=>{play=true;next()};document.getElementById("bp").onclick=()=>{play=!play;if(play)t0=performance.now()-(parseFloat(bar.children[cur].firstChild.style.width)||0)/100*S[cur].t*1000};
document.getElementById("bf").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
bar.onclick=e=>{const b=e.target.closest("i");if(b)show(+b.dataset.i)};
addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="Enter")next();else if(e.key==="ArrowRight")prev();else if(e.key===" "){e.preventDefault();document.getElementById("bp").click()}else if(e.key==="h"||e.key==="H")document.getElementById("ui").classList.toggle("h");else if(e.key==="f"||e.key==="F")document.getElementById("bf").click()});
const fr=document.getElementById("fr");function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);fr.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}fit();addEventListener("resize",fit);
show(0);requestAnimationFrame(loop);
</script></body></html>
