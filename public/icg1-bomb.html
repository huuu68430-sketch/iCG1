.btn1{width:auto;padding:12px 32px;font-size:24px}.btn1:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn2{padding:12px 26px;border-radius:16px;font:800 18px Tajawal;background:rgba(10,7,4,.8);border:1px solid rgba(232,190,110,.45);transition:.2s}.btn2:hover{background:rgba(232,190,110,.15)}

.word{padding:2px 24px;border-radius:16px;color:#1a1006;background:linear-gradient(180deg,#f9e0a4,#c08b3a);box-shadow:0 0 22px rgba(232,190,110,.4)}

.pc{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 6px;border-radius:14px;font-weight:800;background:rgba(18,13,7,.85);border:1px solid rgba(232,190,110,.35);transition:.2s}
.pc .nb{min-width:28px;height:28px;font-size:16px}.pc:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold)}
.pc.hold{border-color:var(--fire);box-shadow:0 0 18px rgba(255,154,60,.55);background:rgba(60,30,8,.9)}
.pc.dead{opacity:.35;text-decoration:line-through;cursor:default}
.ov{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}.ov.on{display:grid}
.flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,#fff4cf 0%,#ff9a3c 30%,transparent 68%);animation:fl 1s ease-out forwards}
@keyframes fl{from{opacity:1;transform:scale(.2)}to{opacity:0;transform:scale(2.4)}}
.boom{position:relative;text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}.boom svg{width:min(260px,60vw);animation:burst .7s ease-out}
@keyframes burst{from{transform:scale(.1) rotate(-40deg)}60%{transform:scale(1.2)}}
.boom h2{margin:0;font:italic 800 clamp(34px,5vw,56px)/1.4 var(--dsp);text-shadow:0 0 30px rgba(255,154,60,.7)}.boom p{margin:0;color:var(--mut);font-weight:700;font-size:18px}
.winc{padding:34px 40px}.winc .tro{font-size:70px;color:var(--gold);filter:drop-shadow(0 0 24px rgba(232,190,110,.7))}.winc .row{display:flex;gap:12px;justify-content:center;margin-top:20px}.winc .btn1{font-size:20px}
.shake{animation:shk .5s}@keyframes shk{20%{transform:translate(-9px,5px)}40%{transform:translate(8px,-6px)}60%{transform:translate(-6px,-4px)}80%{transform:translate(5px,4px)}}
#toast{position:fixed;bottom:100px;left:50%;transform:translate(-50%,30px);opacity:0;z-index:80;padding:12px 26px;border-radius:14px;background:rgba(10,8,5,.96);border:1px solid var(--gold);font-weight:800;transition:.3s;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:1300px){.cam{display:none}}
@media(max-width:820px){.two{grid-template-columns:1fr}.pill{font-size:24px;padding:10px 16px}.top{display:none}.dock{flex-wrap:wrap;justify-content:center}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

const IC={gear:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',play:'<path d="M6 3l14 9-14 9z"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',exit:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.7V17c0 .6-.5 1-1 1.2C7.9 18.8 7 20.2 7 22M14 14.7V17c0 .6.5 1 1 1.2 1.1.6 2 2 2 3.8"/><path d="M18 2H6v7a6 6 0 0 0 12 0z"/>',skull:'<circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><path d="M8 20v2h8v-2M12.5 17l-.5-1-.5 1zM16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"/>',send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>'};
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const BOMB=s=>`<svg class="bomb" width="${s}" height="${s}" viewBox="-6 -12 112 120" aria-hidden="true"><circle cx="46" cy="60" r="34" fill="#17100a" stroke="#e8be6e" stroke-width="5"/><circle cx="46" cy="60" r="26" fill="none" stroke="rgba(232,190,110,.28)" stroke-width="2"/><path d="M24 52a24 24 0 0 1 13-17" fill="none" stroke="#f6e2b2" stroke-width="5" stroke-linecap="round"/><rect x="37" y="18" width="20" height="14" rx="3" fill="#e8be6e"/><path d="M47 18c0-10 9-11 17-18" fill="none" stroke="#c98a4a" stroke-width="5" stroke-linecap="round"/><g class="sp" stroke="#ffb347" stroke-width="4" stroke-linecap="round"><path d="M68-6v14M61 1h14M63-4l10 10M73-4L63 6"/></g></svg>`;
const star=(()=>{let p=[];for(let i=0;i<24;i++){const a=i*Math.PI/12,r=i%2?40:66;p.push((100+r*Math.cos(a)).toFixed(1)+","+(100+r*Math.sin(a)).toFixed(1))}return p.join(" ")})();
const $=s=>document.querySelector(s);
const cfg={max:50,hi:45,lo:15,pass:8,word:"دخول"};
const COL=["#f0c25a","#d2824a","#c9a86a","#e0a458","#b98a5a","#f3d58a","#cf9f6f","#a9884f"];
let scr="setup",P=[],G={lock:true},AC,tt,tm;
const ar=s=>String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const av=(p,c='')=>`<div class="av ${c}" style="--ac:${p.col}"><span>${[...p.name][0].toUpperCase()}</span></div>`;
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2300)};
const ac=()=>AC=AC||new(window.AudioContext||window.webkitAudioContext)();
const tone=(f,d,t=0,v=.12,ty='sine')=>{try{const c=ac(),o=c.createOscillator(),g=c.createGain(),n=c.currentTime+t;o.type=ty;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d)}catch(e){}};
function boomSnd(){try{const c=ac(),n=c.sampleRate*1.3,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type="lowpass";f.frequency.value=900;g.gain.value=.6;s.connect(f);f.connect(g);g.connect(c.destination);s.start();tone(70,.7,0,.35)}catch(e){}}
const whoosh=()=>{tone(520,.12,0,.08,'triangle');tone(780,.12,.08,.08,'triangle')},fan=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.6,i*.14,.12,'triangle'));
const stp=k=>`<div class="stp"><button data-k="${k}" data-d="1" aria-label="زيادة">${ic('plus')}</button><b id="v-${k}">${cfg[k]}s</b><button data-k="${k}" data-d="-1" aria-label="إنقاص">${ic('minus')}</button></div>`;
function setScr(s){scr=s;document.body.dataset.s=s;G.lock=true;clearTimeout(tm);$("#ov").classList.remove("on")}
function setup(){setScr("setup");P=[];$("#scr").innerHTML=`<div class="two">
<div class="card"><div class="ch"><h2>إعدادات اللعبة</h2>${ic('gear')}</div>
<div class="box"><div class="bl"><label for="mx">الحد الأقصى للاعبين</label><b id="mxv">${cfg.max}</b></div><input type="range" id="mx" min="3" max="200" value="${cfg.max}"></div>
<div class="row2"><div class="box c"><label>أكثر وقت للقنبلة</label>${stp('hi')}</div><div class="box c"><label>أقل وقت للقنبلة</label>${stp('lo')}</div></div>
<div class="box c"><label>وقت التمرير (ثواني)</label>${stp('pass')}</div>
<div class="box"><label for="jw">كلمة الانضمام</label><input class="txt" id="jw" value="${cfg.word}" maxlength="12"></div></div>
<div class="card hw">${BOMB(120)}<h2>كيف تلعب؟</h2><ol>
<li><span class="sn">1</span><span>القنبلة تبدأ عند لاعب عشوائي</span></li>
<li><span class="sn">2</span><span>اكتب رقم اللاعب لتمريرها، مثل <span class="nb">8</span></span></li>
<li><span class="sn">3</span><span>من تنفجر عنده يخرج!</span></li></ol>
<button class="go" data-a="go">${ic('play','f')}بدء المعركة</button></div></div>`}
function step(k,d){const v=cfg[k]+d*(k==="pass"?1:5),lo=k==="hi"?cfg.lo+5:k==="lo"?5:3,hi=k==="hi"?120:k==="lo"?cfg.hi-5:30;cfg[k]=Math.max(lo,Math.min(hi,v));$("#v-"+k).textContent=cfg[k]+"s"}
function lobby(){setScr("lobby");$("#scr").innerHTML=`<div class="lob">${BOMB(90)}<h2 class="h2">في انتظار اللاعبين</h2>
<div class="pill"><span>أرسل</span><b class="word">${cfg.word}</b><span>للمشاركة</span></div>
<form class="hostrow" id="af"><input id="an" class="txt" placeholder="اسم لاعب (للتجربة)" maxlength="18" aria-label="اسم لاعب"><button class="mini" type="submit">${ic('plus')}إضافة</button><button class="mini" type="button" data-a="demo">${ic('users')}6 لاعبين تجريبيين</button></form>
<div class="plist" id="pl"></div></div>
<div class="dock"><div class="cnt"><b id="pc">0</b><small>${cfg.max} /</small></div><span class="sp"></span><button class="btn2" data-a="back">تراجع</button><button class="btn1" id="st" data-a="start" disabled>${ic('play','f')}ابدأ!</button></div>`;drawLobby()}
function drawLobby(){$("#pl").innerHTML=P.length?P.map(p=>`<div class="pcard"><span class="nb">${p.num}</span>${av(p)}<span class="t">${p.name}</span></div>`).join(""):`<div class="emp">${ic('users')}<span>لا يوجد لاعبون بعد</span></div>`;$("#pc").textContent=P.length;$("#st").disabled=P.length<2}
function addPlayer(name){name=String(name||"").trim().slice(0,18);if(!name||scr!=="lobby")return false;if(P.some(p=>p.name.toLowerCase()===name.toLowerCase()))return false;if(P.length>=cfg.max){toast("اكتمل عدد اللاعبين");return false}let n=1;while(P.some(p=>p.num===n))n++;P.push({name,num:n,alive:true,col:COL[[...name].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length]});drawLobby();tone(740,.1,0,.07,'triangle');return true}
function start(){if(P.length<2)return;P.forEach(p=>p.alive=true);setScr("play");G={round:1,evt:""};$("#scr").innerHTML=`<div class="rd"><span class="chip">الجولة <b id="rn">1</b></span><span class="chip">${ic('users')}متبقي <b id="al">0</b></span></div>
<div class="hcard"><div id="hv"></div><div class="bw" id="bw">${BOMB(96)}</div><p class="hint">اكتب رقم اللاعب لتمرير القنبلة. مثال: <span class="nb">8</span></p><div class="pt"><div class="bar"><i id="pb"></i></div><span id="ps"></span></div></div>
<div class="evt" id="evt"></div>
<form class="hostrow" id="pf"><input id="pi" class="txt" placeholder="رقم أو اسم (يمثل رسالة الحامل)" aria-label="رسالة الحامل"><button class="mini" type="submit">${ic('send')}تمرير</button></form>
<div class="chips" id="chips"></div>`;newRound()}
function newRound(){const al=P.filter(p=>p.alive),n=Date.now();G.holder=al[Math.random()*al.length|0];G.t0=n;G.fuse=n+(cfg.lo+Math.random()*(cfg.hi-cfg.lo))*1000;G.pe=n+cfg.pass*1000;G.nt=0;G.lock=false;drawPlay(true)}
function drawPlay(anim){const h=G.holder;$("#hv").className="hv"+(anim?" in":"");$("#hv").innerHTML=`${av(h,'lg')}<div class="hn">${h.name}</div><div class="hnum">رقمه <span class="nb">${h.num}</span></div>`;$("#rn").textContent=G.round;$("#al").textContent=P.filter(p=>p.alive).length;$("#evt").textContent=G.evt||"";
 $("#chips").innerHTML=P.map(p=>`<button class="pc ${p.alive?'':'dead'} ${p===h&&p.alive?'hold':''}" data-a="chip" data-n="${p.num}" ${p.alive?'':'disabled'}><span class="nb">${p.num}</span><span>${p.name}</span>${p.alive?'':ic('skull')}</button>`).join("")}
const parse=t=>{t=ar(t).trim();let m=t.match(/^(?:رقم\s*)?(\d+)$/);if(m)return P.find(p=>p.num===+m[1]);m=t.match(/^@?(\S+)$/);return m?P.find(p=>p.name.toLowerCase()===m[1].toLowerCase()):null};
function pass(to){if(scr!=="play"||G.lock||!to||!to.alive||to===G.holder)return false;const f=G.holder;G.holder=to;G.pe=Date.now()+cfg.pass*1000;G.evt=`${f.name} مرّر القنبلة إلى ${to.name} (رقم ${to.num})`;whoosh();drawPlay(true);return true}
function explode(){G.lock=true;const h=G.holder;h.alive=false;boomSnd();drawPlay(false);$("main").classList.add("shake");setTimeout(()=>$("main").classList.remove("shake"),500);
 $("#ov").innerHTML=`<div class="flash"></div><div class="boom"><svg viewBox="0 0 200 200" aria-hidden="true"><polygon points="${star}" fill="#ff9a3c" stroke="#fff0b8" stroke-width="4" stroke-linejoin="round"/><circle cx="100" cy="100" r="34" fill="#ffe08a"/><circle cx="100" cy="100" r="18" fill="#fff8e0"/></svg><h2>انفجرت عند ${h.name}!</h2><p>رقم ${h.num} خرج من اللعبة</p></div>`;$("#ov").classList.add("on");
 tm=setTimeout(()=>{if(scr!=="play")return;$("#ov").classList.remove("on");const al=P.filter(p=>p.alive);if(al.length<=1)return win(al[0]);G.round++;G.evt=`${h.name} خرج. ${al.length} لاعبين متبقين`;newRound()},3000)}
function win(p){fan();$("#ov").innerHTML=`<div class="card winc boom"><div class="tro">${ic('trophy','f')}</div><h2>الفائز</h2>${av(p,'lg')}<h2>${p.name}</h2><p>رقم ${p.num}</p><div class="row"><button class="btn1" data-a="again">${ic('play','f')}العب مرة ثانية</button><button class="btn2" data-a="exit">الإعدادات</button></div></div>`;$("#ov").classList.add("on")}
setInterval(()=>{if(scr!=="play"||G.lock)return;const n=Date.now(),rest=Math.max(0,G.pe-n),r=Math.min(1,(n-G.t0)/(G.fuse-G.t0)),bs=Math.max(.3,1.2-.9*r).toFixed(2);
 $("#pb").style.width=rest/(cfg.pass*1000)*100+"%";$("#pb").classList.toggle("low",rest<2500);$("#ps").textContent=Math.ceil(rest/1000)+"s";$("#bw").style.setProperty("--bs",bs+"s");
 if(n>=G.nt){tone(r>.7?1200:900,.05,0,.05,'square');G.nt=n+bs*1000}
 if(n>=G.fuse||n>=G.pe)explode()},100);
window.joinPlayer=addPlayer;
window.chatMessage=(user,text)=>{user=String(user||"");text=String(text||"");if(scr==="lobby"&&text.trim()===cfg.word)return addPlayer(user);if(scr==="play"&&G.holder&&user.toLowerCase()===G.holder.name.toLowerCase())return pass(parse(text))};
document.addEventListener("click",e=>{const k=e.target.closest("[data-k]");if(k)return step(k.dataset.k,+k.dataset.d);const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a==="go"){P=[];lobby()}else if(a==="back"||a==="exit")setup();else if(a==="start")start();else if(a==="again"){$("#ov").classList.remove("on");start()}
 else if(a==="demo")["HSG2","POWR_HSG","HS7f","ryo0_2","D77T","Nayer12"].forEach(addPlayer);else if(a==="chip")pass(P.find(p=>p.num===+b.dataset.n))});
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="af"){const i=$("#an");if(addPlayer(i.value))i.value="";i.focus()}if(e.target.id==="pf"){const i=$("#pi");if(G.holder&&pass(parse(i.value)))i.value="";else toast("اكتب رقم لاعب حي غير الحامل")}});
document.addEventListener("input",e=>{if(e.target.id==="mx"){cfg.max=+e.target.value;$("#mxv").textContent=cfg.max}if(e.target.id==="jw")cfg.word=e.target.value.trim()||"دخول"});
$("#exit").innerHTML=ic('exit');$("#exit").onclick=setup;
setup();
(()=>{if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const cv=$("#fx"),x=cv.getContext("2d");let W,H;const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rs();addEventListener("resize",rs);const Q=Array.from({length:36},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.4,v:Math.random()*.45+.15,a:Math.random()*.5+.15}));(function f(){x.clearRect(0,0,W,H);for(const p of Q){p.y-=p.v;p.x+=Math.sin(p.y/60)*.3;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=`rgba(255,170,80,${p.a})`;x.fill()}requestAnimationFrame(f)})()})();
</script>
