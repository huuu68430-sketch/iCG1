<style>

.stage{perspective:1400px;position:relative}.stage .fr{width:min(100%,calc((100vh - 205px)*1.3714));margin:auto}

.rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from var(--a),color-mix(in srgb,var(--rc) 24%,transparent) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 5%,transparent 55%);mask:radial-gradient(circle,#000 5%,transparent 55%);animation:sp 16s linear infinite}

.av{width:160px;height:160px;margin:0 auto 12px;border-radius:50%;padding:6px;background:conic-gradient(from var(--a),#fff3c4,#c9993f,#7a5518,#fff3c4);animation:sp 3s linear infinite,zi 1s cubic-bezier(.2,1.6,.4,1) both .7s;box-shadow:0 0 60px color-mix(in srgb,var(--rc) 60%,transparent)}.av>div{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font:400 70px Lalezar;color:#1a1005}@keyframes zi{from{transform:scale(0) rotate(-180deg)}}
.wt{font-size:clamp(22px,4vw,38px);letter-spacing:4px;color:var(--rc);font-weight:900;animation:lt 1.2s cubic-bezier(.2,.9,.3,1) both 1s}@keyframes lt{from{letter-spacing:40px;opacity:0;filter:blur(14px)}}

.sw{position:absolute;left:50%;top:45%;width:20px;height:20px;margin:-10px;border:3px solid var(--rc);border-radius:50%;animation:swv 2.8s ease-out infinite;z-index:1}.s2{animation-delay:.9s}.s3{animation-delay:1.8s}@keyframes swv{from{transform:scale(1);opacity:1}to{transform:scale(90);opacity:0}}
.tie2{display:flex;justify-content:center;align-items:center;gap:20px;margin-bottom:10px}.tl{animation:inl 1s cubic-bezier(.5,0,.2,1) both .3s}.tr{animation:inr 1s cubic-bezier(.5,0,.2,1) both .3s}@keyframes inl{from{transform:translateX(-80vw) rotate(-720deg)}}@keyframes inr{from{transform:translateX(80vw) rotate(720deg)}}.vs{font-size:70px;animation:vs .6s cubic-bezier(.2,1.8,.4,1) both 1.2s;filter:drop-shadow(0 0 20px #9fd4ff)}@keyframes vs{from{transform:scale(0) rotate(90deg)}}
.tt{font:400 clamp(70px,13vw,160px) Lalezar;line-height:1.1;color:#fff;animation:gl .35s steps(2) infinite 1.3s,pu 1s both 1.2s}@keyframes gl{0%{text-shadow:6px 0 #f6dc9b,-6px 0 #9fd4ff}50%{text-shadow:-8px 3px #f6dc9b,8px -3px #9fd4ff}}
.fl{position:absolute;inset:0;background:#fff;z-index:3;pointer-events:none;opacity:0;animation:fl 1s ease-out 1.2s}@keyframes fl{0%{opacity:.9}100%{opacity:0}}.shk{animation:shk .6s 1.2s}@keyframes shk{20%{transform:translate(-10px,6px)}40%{transform:translate(10px,-6px)}60%{transform:translate(-6px,4px)}80%{transform:translate(6px,-3px)}}
.tag{font-size:11px;color:var(--mu)}
.jw{padding:6px 28px;border-radius:12px;background:linear-gradient(180deg,#f6dc9b,#c9993f);color:#2a1a05;font-size:30px;box-shadow:0 0 24px #c9993f88;animation:pl 1.6s ease-in-out infinite}@keyframes pl{50%{box-shadow:0 0 44px #f6dc9bcc;transform:scale(1.06)}}
.orb{position:relative;width:170px;height:170px;margin:14px auto}.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from var(--a),transparent 0,#f6dc9b 25%,transparent 55%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));animation:sp 2s linear infinite;filter:drop-shadow(0 0 8px #c9993f)}.r2{inset:16px;animation-duration:3.4s;animation-direction:reverse;opacity:.7}
.num{position:absolute;inset:0;display:grid;place-content:center;font-family:Lalezar;line-height:1}.num b{font-size:56px;font-weight:400;background:linear-gradient(180deg,#fff3c4,#c9993f);-webkit-background-clip:text;background-clip:text;color:transparent}.num small{color:var(--mu);font-size:14px}
