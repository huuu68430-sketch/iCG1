function modal(title,body,ok,okt){$('#md').innerHTML=`<h3>${title}</h3>${body}<div class="tb" style="margin-top:16px"><button class="btn" id="ok">${okt||'حفظ'}</button><button class="btn o" onclick="cm()">إلغاء</button></div>`;mb.style.display='grid';$('#ok').onclick=function(){if(this.disabled)return;this.disabled=true;if(ok()===false)this.disabled=false}}
const cm=()=>{mb.style.display='none'};mb.onclick=e=>{if(e.target==mb)cm()};
function fld(f,v=''){const[k,l,t,o]=f;return `<label>${l}</label>`+(t=='sel'?`<select class="f" data-k="${k}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`:t=='area'?`<textarea class="f" data-k="${k}" rows="3">${v}</textarea>`:`<input class="f" data-k="${k}" type="${t||'text'}" value="${v}">`)}
function read(s){const o={};document.querySelectorAll('#md [data-k]').forEach(e=>o[e.dataset.k]=e.type=='number'?+e.value:e.value);return o}
function addM(){const s=cs();modal('إضافة — '+s.t,s.form.map(f=>fld(f)).join(''),()=>{const o=read();if(!o[s.form[0][0]]){toast('الحقل الأول مطلوب',1);return false}const r={...(s.def||{}),...o};if(s.id=='notif'){r.time=now()}s.rows.unshift(r);log('إضافة',o[s.form[0][0]],s.t);toast('تمت الإضافة');cm();rd()})}
function editM(i){const s=cs(),r=s.rows[i];modal('تعديل',s.form.map(f=>fld(f,r[f[0]]??'')).join(''),()=>{const o=read();Object.assign(r,o);log('تعديل',r[s.form[0][0]],s.t);toast('تم الحفظ');cm();rd()})}
function delM(i){const s=cs(),r=s.rows[i];modal('تأكيد الحذف',`<p>هل تريد حذف «${r[s.cols[0][0]]}» نهائياً؟</p>`,()=>{s.rows.splice(i,1);log('حذف',r[s.cols[0][0]],s.t);toast('تم الحذف');cm();rd()},'حذف')}
function statsM(r){modal('تعديل إحصائيات '+r.name,`<div class="card">النقاط: <b>${r.pts}</b> · الرصيد: <b>${r.bal}</b> · الفوز: <b>${r.wins}</b></div>`+fld(['f','الحقل','sel',['النقاط','الرصيد','الانتصارات']])+fld(['d','القيمة (موجبة للإضافة وسالبة للخصم)','number'],0)+fld(['why','سبب التعديل (إجباري)']),()=>{const o=read();if(!o.why.trim()||!o.d){toast('السبب والقيمة مطلوبان',1);return false}const k={'النقاط':'pts','الرصيد':'bal','الانتصارات':'wins'}[o.f];if(r[k]+o.d<0){toast('لا يمكن أن تصبح القيمة سالبة',1);return false}if(Math.abs(o.d)>10000){toast('تجاوز حد العملية الإدارية (10000)',1);return false}const b=r[k];r[k]+=o.d;log(k=='bal'?'رصيد':'إحصائيات',r.name,`${o.f}: ${b} ← ${r[k]} — ${o.why}`);toast('تم التعديل');cm();rd()},'تأكيد التنفيذ')}
function crm(r){const lg=D.audit.filter(a=>a.target==r.name);modal('ملف اللاعب: '+r.name,`<div class="grid" style="grid-template-columns:1fr 1fr">${st([['النقاط',r.pts,'trophy'],['الرصيد',r.bal,'coin'],['الفوز',r.wins,'crown'],['الحالة',r.status,'shield']])}</div>`+fld(['note','ملاحظة داخلية (لا تظهر للاعب)','area'],r.note)+`<label>سجل العمليات (${lg.length})</label>`+lg.slice(0,5).map(a=>`<div class="fd"><i></i>${a.type}: ${a.detail}</div>`).join(''),()=>{r.note=read().note;log('ملاحظة',r.name,'تحديث');toast('تم حفظ الملاحظة');cm()})}
function massM(){modal('مكافأة جماعية',fld(['v','المبلغ لكل لاعب نشط','number'],50)+fld(['why','السبب (إجباري)']),()=>{const o=read(),a=D.u.filter(u=>u.status=='نشط');if(!o.why||o.v<=0||o.v>1000){toast('أدخل سبباً ومبلغاً بين 1 و1000',1);return false}a.forEach(u=>u.bal+=o.v);log('رصيد',''+a.length+' لاعب','مكافأة جماعية +'+o.v+' — '+o.why);toast('تمت المكافأة لـ '+a.length+' لاعب');cm();rd()},'تنفيذ')}

(function(){const c=document.getElementById('pc'),x=c.getContext('2d');let W,H,ps=[];function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);for(let k=0;k<70;k++)ps.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,v:Math.random()*.35+.1,a:Math.random()*6});(function f(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.y-=p.v;p.a+=.02;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}x.beginPath();x.arc(p.x+Math.sin(p.a)*12,p.y,p.r,0,7);x.fillStyle='rgba(233,194,122,'+(.25+Math.sin(p.a)*.2)+')';x.shadowBlur=8;x.shadowColor='#e9c27a';x.fill()});requestAnimationFrame(f)})()})();
function post(){document.querySelectorAll('.card').forEach((c,i)=>c.style.animationDelay=Math.min(i*50,600)+'ms');document.querySelectorAll('tr').forEach((r,i)=>r.style.setProperty('--d',Math.min(i*30,500)+'ms'));document.querySelectorAll('.st b').forEach(b=>{const t=b.textContent.replace(/,/g,'');if(!/^\d+$/.test(t))return;const n=+t,t0=performance.now();(function s(now){const k=Math.min((now-t0)/800,1),e=1-Math.pow(1-k,3);b.textContent=Math.round(n*e).toLocaleString();if(k<1)requestAnimationFrame(s)})(t0)})}
const _rd=rd;rd=function(){_rd();post()};setTimeout(post,350);
