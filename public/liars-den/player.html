<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>LIAR’S DEN</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b0604">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#e8c07a;--ink:#f6e7c8;--a:#e8c07a;--b:#a32c28;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#0b0604;color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
body{background:radial-gradient(120% 70% at 50% 0,#2e180c 0,#0b0604 62%)}
button{font-family:inherit;cursor:pointer;border:0}
.fl{position:fixed;inset:0;overflow:hidden;pointer-events:none}.fl span{position:absolute;bottom:-50px;font-size:30px;color:#e8c07a1c;animation:rise 22s linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(300deg)}}
.sc{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .45s,transform .45s,visibility .45s;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.sc.on{opacity:1;visibility:visible;transform:none}
.lg{width:92px;height:92px;border-radius:50%;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.ttl{font:900 clamp(26px,6vw,40px) Cinzel,Georgia,serif;letter-spacing:.06em;background:linear-gradient(100deg,#8a5a1c 20%,#fff3d0 45%,#e8c07a 55%,#8a5a1c 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
#conn{align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.sp{width:34px;height:34px;border-radius:50%;border:3px solid #e8c07a33;border-top-color:var(--gold);animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#msg{color:#c9b48a;font-size:17px}#rc{display:none;gap:8px}#rc input{width:150px;text-align:center;font:900 26px Cinzel,serif;letter-spacing:6px;text-transform:uppercase}

.bt{padding:14px 26px;border-radius:40px;font:800 19px Tajawal;color:#1a1005;background:linear-gradient(#f9e2a8,#c88f3c 60%,#a8793a);transition:transform .2s}.bt:active{transform:scale(.95)}.bt:disabled{filter:grayscale(1) brightness(.6)}
.bt.red{background:linear-gradient(#ff7a66,#c0402c 60%,#8a2418);color:#fff}

.hdr{display:flex;align-items:center;gap:12px;padding:12px 16px}.hdr .lg{width:46px;height:46px;animation:none}.hdr h1{margin:0;font:800 22px Tajawal}.hdr small{margin-inline-start:auto;font:900 15px Cinzel,serif;letter-spacing:4px;color:var(--gold)}
#car{flex:1;display:flex;align-items:center;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 calc(50vw - min(38vw,170px));scrollbar-width:none}#car::-webkit-scrollbar{display:none}
.ch{position:relative;flex:0 0 min(76vw,340px);max-height:100%;scroll-snap-align:center;border-radius:26px;padding:12px 14px 16px;background:linear-gradient(#1c1209,#0d0805);border:2px solid #3d2a14;text-align:center;transition:transform .4s,border-color .4s;transform:scale(.9);opacity:0;animation:in .6s calc(var(--i)*.1s) forwards}
@keyframes in{to{opacity:1}}.ch.s{transform:scale(1);border-color:var(--a)}
.ch:before{content:'';position:absolute;inset:0;border-radius:24px;background:radial-gradient(70% 50% at 50% 30%,color-mix(in srgb,var(--a) 28%,transparent),transparent);pointer-events:none}
.av{height:min(40vh,300px);display:flex;justify-content:center;position:relative}.av svg{height:100%;animation:fl 4.5s ease-in-out infinite;animation-delay:calc(var(--i)*-1s)}
.bl{transform-box:fill-box;transform-origin:center;animation:bl 5s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.ch h2{margin:4px 0 0;font:800 28px Tajawal}.ch small{font:700 12px Cinzel,serif;letter-spacing:4px;color:var(--a)}.ch p{margin:6px 0 8px;font-size:14px;color:#c9b48a;min-height:2.6em}
.stt{display:flex;justify-content:center;gap:14px;font-size:12px;color:#a8946c}.stt b{display:block;font-weight:500}.stt i{display:inline-block;width:7px;height:7px;margin:0 1px;border-radius:50%;background:#3a2a16}.stt i.on{background:var(--a)}
.tk:after{content:attr(data-n);position:absolute;inset:0;border-radius:24px;background:#000b;display:grid;place-items:center;font:800 20px Tajawal;color:#a8946c}
.ft{display:flex;gap:10px;padding:12px 16px 16px;justify-content:center}.ft input{flex:1;max-width:260px}

.cd{position:relative;width:var(--w,72px);aspect-ratio:2/3;flex:none;border-radius:9px;background:linear-gradient(145deg,#fffaf0,#ecdcb8);border:2px solid var(--c);color:var(--c);font-family:Cinzel,Georgia,serif;display:grid;place-items:center;box-shadow:0 5px 12px #0009}
.cd b{position:absolute;top:3px;inset-inline-start:6px;font-size:calc(var(--w)*.25);line-height:1}.cd i{font-style:normal;font-size:calc(var(--w)*.5)}.cd span{position:absolute;bottom:3px;font-weight:900;font-size:calc(var(--w)*.12);letter-spacing:.12em}
.cA{--c:#14213d}.cK{--c:#8f1d2c}.cQ{--c:#8a2a66}.cJ{--c:#1f6f55}
/* game: the 3D scene fills the screen, the UI floats above it */
#game{display:grid;grid-template-rows:auto auto 1fr auto;pointer-events:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none;pointer-events:auto;background:#080403}
body.g3 #cv{display:block}
body.ing .fl{display:none}
#game>*:not(#cv){position:relative;z-index:1}
.tp{display:flex;align-items:center;gap:10px;padding:8px 14px 18px;background:linear-gradient(#000c,#0000)}.mi{width:42px;height:42px;border-radius:50%;overflow:hidden;border:2px solid var(--a);background:#1a1209}.mi svg{width:100%;height:100%}
.me b{display:block;font:800 16px Tajawal;text-shadow:0 1px 6px #000}.pips i{display:inline-block;width:11px;height:11px;margin-inline-end:3px;border-radius:50%;background:#2b2216;border:1px solid #6b5230}.pips i.u{background:#6b1b12;border-color:#c0402c}
#tcw{margin-inline-start:auto;display:flex;align-items:center;gap:8px;perspective:600px}#tcw .cd{--w:40px;animation:tf 1s cubic-bezier(.2,.9,.25,1.15) both}#tcw small{font:700 9px Cinzel,serif;letter-spacing:2px;color:var(--gold);display:block}#tcw strong{font:900 18px Cinzel,serif;color:var(--gold);text-shadow:0 1px 6px #000}
@keyframes tf{from{transform:rotateY(-540deg) scale(.3);opacity:0}to{transform:none}}
#pr{display:flex;gap:6px;padding:0 10px}.pc{flex:1;min-width:0;padding:5px 4px;border-radius:12px;background:#120b05d9;border:1px solid #3d2a14;text-align:center;font-size:12px;transition:transform .3s}.pc b{display:block;font:800 13px Tajawal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc .pips i{width:7px;height:7px;margin:0 1px}
.pc.t{border-color:var(--gold);transform:translateY(-3px)}.pc.d{opacity:.35;filter:grayscale(1)}.pc.m{background:#2a1c0ed9}.pc.v{box-shadow:0 0 0 2px #fff4 inset}
#mid{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;text-align:center;padding:8px 16px}
#sts{font:800 clamp(18px,5.4vw,26px) Tajawal;text-shadow:0 2px 10px #000,0 0 3px #000;background:#0008;border-radius:30px;padding:2px 16px}#sts.my{color:var(--gold);animation:bp 1s ease-in-out infinite}@keyframes bp{50%{transform:scale(1.08)}}
#clm{font:700 15px Tajawal;color:#fff;background:#8a2418e6;border-radius:30px;padding:4px 14px;display:none}#clm.on{display:block;animation:in .4s forwards}
#lgl{font-size:14px;color:#e6d4aa;min-height:1.3em;animation:in .4s;text-shadow:0 1px 8px #000,0 0 3px #000}
#tmw{width:min(260px,64%);height:4px;border-radius:3px;background:#2b221688;overflow:hidden}#tm{height:100%;background:var(--a);transform-origin:right;transform:scaleX(0)}
#gfx{position:absolute;top:6px;inset-inline-end:10px;width:38px;height:38px;border-radius:50%;background:#120b05cc;border:1px solid #5a4020;color:var(--gold);font-size:17px;pointer-events:auto}
#bt{background:linear-gradient(#0000,#000d 45%)}

#rv{background:#000a}
.ov big{font-size:84px;animation:bp 1.2s infinite}.ov h2{margin:0;font:800 32px Tajawal}.ov p{margin:0;color:#c9b48a;font-size:18px}

#bn{position:fixed;top:env(safe-area-inset-top);left:0;right:0;z-index:10;text-align:center;background:#8a2418;padding:4px;font-size:14px;display:none}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

  if(G0)sync(G0);apply()}catch(err){failed=true;console.warn('3D off',err);document.body.classList.remove('g3')}}
function load(){if(ready||loading||failed)return;if(mode==2)return;loading=true;
 if(window.THREE){loading=false;return init()}
 const s=document.createElement('script');s.src='/liars-den/vendor/three.min.js';s.async=true;s.onload=()=>{loading=false;init()};s.onerror=()=>{loading=false;failed=true};document.head.appendChild(s)}
// ---- host -> phone
function sync(g){G0=g;meSeat=g.me;meAlive=g.alive;if(!ready)return;
 g.pl.forEach((q,i)=>{const p=S[i];if(!p)return;if(p.name!==q.name){p.name=q.name;tagUpd(p)}
  if(!q.alive&&p.alive&&!p.dying)slump(p);else if(q.alive&&!p.alive&&!p.dying)revive(p);
  if(p.alive&&p.cnt!==q.cards&&p.hn!==q.cards){p.cnt=q.cards;showHand(p,q.cards)}});
 refreshVis()}
function ev(m){if(!ready||failed||!active||mode==2)return;const p=S[m.i],now=performance.now();
 switch(m.k){
 case'round':pile.clear();over=-1;foc={pt:()=>TBL,until:now+1800};break;
 case'reset':resetAll();break;
 case'think':if(p&&p.alive){think(p,m.ms);foc={i:m.i,w:.7,until:now+m.ms+400}}break;
 case'play':if(p){playAnim(p,m.n);foc={pt:()=>TBL,until:now+1900}}break;
 case'call':if(p&&S[m.to]){callAnim(p,S[m.to]);foc={i:m.i,w:.9,until:now+1900}}break;
 case'rev':foc={pt:()=>TBL,until:now+3800};break;
 case'spin':if(p){spin(p);foc=m.i===lastVS?{pt:()=>p.gun.position,until:now+7000}:{i:m.i,w:1,until:now+7000}}break;
 case'shot':if(p){p.shot=m.dead?1:2;if(p.shotRes)p.shotRes()}break;
 case'win':over=m.seat;foc=null;break}}
return{load,init,sync,ev,cycle:d=>{cycle(d)},setMode,ok:()=>ready&&!failed&&mode!=2,get mode(){return mode},
 act(v){active=v;if(ready){if(v)apply();else stop()}},onView(f){cb.view=f}}
})();
V3.onView(name=>{$('#povn').textContent=name});

// ---- state
let seat=-1,sel=0,seats=[],name='',cur='conn',myTurn=false,canCall=false,G=null,pick=new Set(),lastTable=null,lastHand='',wasAlive=true,curTid=0,started=false;
function post(m){try{parent.postMessage(Object.assign({source:'icg-ld-player'},m),location.origin)}catch(e){}}
const send=m=>post({type:'icg:ld:act',tid:curTid,act:m});
function show(id){cur=id;document.querySelectorAll('.sc').forEach(e=>e.classList.toggle('on',e.id==id));const c=CH[seat>=0?seat:sel];document.documentElement.style.setProperty('--a',c.a);document.body.classList.toggle('ing',id=='game');V3.act(id=='game');if(id=='wait'||id=='game')V3.load()}
const vib=n=>navigator.vibrate&&navigator.vibrate(n);
// ---- pick screen
$('#car').innerHTML=CH.map((c,i)=>`<div class="ch" id="ch${i}" style="--i:${i};--a:${c.a}"><div class="av">${av(i)}</div><small>${c.en}</small><h2>${c.n}</h2><p>${c.t}</p><div class="stt">${c.st.map(s=>`<div><b>${s[0]}</b>${[1,2,3,4,5].map(k=>`<i class="${k<=s[1]?'on':''}"></i>`).join('')}</div>`).join('')}</div></div>`).join('');
$('#dots').innerHTML=CH.map(()=>'<i></i>').join('');
function renderPick(){CH.forEach((c,i)=>{const e=$('#ch'+i),t=seats[i]&&seats[i].taken&&i!==seat;e.classList.toggle('s',i==sel);e.classList.toggle('tk',!!t);e.dataset.n=t?'محجوز · '+seats[i].name:''});[...$('#dots').children].forEach((d,i)=>d.classList.toggle('on',i==sel));$('#enter').disabled=!!(seats[sel]&&seats[sel].taken&&sel!==seat);document.documentElement.style.setProperty('--a',CH[sel].a)}
function choose(i,sc){sel=i;renderPick();if(sc)$('#ch'+i).scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});vib(10)}
CH.forEach((c,i)=>$('#ch'+i).onclick=()=>choose(i,1));
let st;$('#car').addEventListener('scroll',()=>{clearTimeout(st);st=setTimeout(()=>{const r=$('#car').getBoundingClientRect(),m=r.left+r.width/2;let b=0,d=1e9;CH.forEach((c,i)=>{const q=$('#ch'+i).getBoundingClientRect(),x=Math.abs(q.left+q.width/2-m);if(x<d){d=x;b=i}});if(b!=sel)choose(b)},90)},{passive:true});
$('#enter').onclick=()=>{const b=$('#enter');if(b.disabled)return;b.disabled=true;b.textContent='جاري الدخول…';post({type:'icg:ld:claim',seat:sel});vib(20)};
function resetEnter(){const b=$('#enter');b.textContent='ادخل اللعبة';b.disabled=false}
function exitGame(){post({type:'icg:ld:leave'});post({type:'icg:ld:exit'})}
$('#exitw').onclick=exitGame;$('#exitg').onclick=exitGame;
$('#chg').onclick=()=>{post({type:'icg:ld:leave'});seat=-1;myTurn=false;show('pick');resetEnter();renderPick()};
// ---- wait
function renderWait(){const c=CH[seat];$('#wav').innerHTML=av(seat);$('#wtg').textContent=c.en;$('#wnm').textContent=name+' · '+c.n;const n=seats.filter(s=>s.taken).length;$('#wch').innerHTML=CH.map((x,i)=>`<div class="chip ${seats[i]&&seats[i].taken?'on':''}" style="--c:${x.a}">${SU[i]}</div>`).join('');$('#wst').textContent=n<4?`بانتظار اللاعبين (${n}/4)`:'اكتمل العدد… تبدأ اللعبة'}
// ---- game HUD
function renderGame(){if(!G)return;const c=CH[G.me],p=G.pl[G.me];document.documentElement.style.setProperty('--a',c.a);
 $('#mi').innerHTML=av(G.me,'30 20 140 150');$('#mn').textContent=name;$('#mp').innerHTML=[0,1,2,3,4,5].map(k=>`<i class="${k<p.pulls?'u':''}"></i>`).join('');
 if(lastTable!==G.table){lastTable=G.table;$('#tcw').innerHTML=card(G.table)+`<div><small>TABLE CARD</small><strong>${ENM[G.table]}</strong></div>`}
 $('#pr').innerHTML=G.pl.map((q,i)=>`<div class="pc ${i==G.turn&&q.alive?'t':''} ${q.alive?'':'d'} ${i==G.me?'m':''}" style="color:${CH[i].a}"><b>${esc(q.name)}</b><div class="pips">${[0,1,2,3,4,5].map(k=>`<i class="${k<q.pulls?'u':''}"></i>`).join('')}</div></div>`).join('');
 const s=$('#sts');s.className=myTurn?'my':'';s.textContent=!G.alive?'تتفرّج':myTurn?'دورك!':'دور '+G.pl[G.turn].name;
 $('#spec').style.display=G.alive?'none':'flex';
 const k=G.claim;$('#clm').className=k?'on':'';if(k)$('#clm').textContent=`${G.pl[k.by].name} يدّعي ${k.k} × ${ENM[G.table]}`;
 const hs=G.hand.join();if(hs!==lastHand){lastHand=hs;pick.clear()}const n=G.hand.length;
 $('#hd').innerHTML=G.hand.map((h,i)=>{const o=i-(n-1)/2;return`<div class="cd c${h} ${pick.has(i)?'s':''}" data-i="${i}" style="--r:${o*6}deg;--y:${Math.abs(o)*5}px">${'<b>'+h+'</b><i>'+SYM[h]+'</i><span>'+ENM[h]+'</span>'}</div>`}).join('');
 $('#hd').className=myTurn&&G.alive?'':'off';$('#call').style.display=myTurn&&canCall?'block':'none';
 const pl=$('#play');pl.disabled=!(myTurn&&pick.size&&n);pl.textContent=pick.size?`العب (${pick.size})`:'اختر أوراقك';pl.style.display=myTurn&&n?'block':'none'}
$('#hd').onclick=e=>{const d=e.target.closest('.cd');if(!d||!myTurn)return;const i=+d.dataset.i;if(pick.has(i))pick.delete(i);else if(pick.size<3)pick.add(i);else{vib([30,30,30]);return}vib(8);renderGame()};
$('#spp').onclick=()=>V3.cycle(-1);$('#spx').onclick=()=>V3.cycle(1);
const GFXN=['جودة تلقائية','جودة منخفضة (أخف)','المشهد ثلاثي الأبعاد مطفأ'];
$('#gfx').onclick=()=>{const m=(V3.mode+1)%3;V3.setMode(m);if(m!=2&&!V3.ok())V3.load();$('#lgl').textContent=GFXN[m];vib(10)};
function timer(ms){const t=$('#tm');t.style.transition='none';t.style.transform=ms?'scaleX(1)':'scaleX(0)';clearTimeout(timerTO);if(ms){void t.offsetWidth;t.style.transition=`transform ${ms}ms linear`;t.style.transform='scaleX(0)';timerTO=setTimeout(done,ms+700)}}
function done(){myTurn=false;timer(0);pick.clear();renderGame()}
let timerTO;
$('#play').onclick=()=>{if(!myTurn)return;send({t:'act',ix:[...pick]});vib(30);done()};$('#call').onclick=()=>{if(!myTurn)return;send({t:'act',call:true});vib([40,40,80]);done()};
let ot;function ov(i,t,s,ms){$('#ovi').textContent=i;$('#ovt').textContent=t;$('#ovs').textContent=s||'';$('#ov').classList.add('on');clearTimeout(ot);if(ms)ot=setTimeout(()=>$('#ov').classList.remove('on'),ms)}
function fx(){const f=$('#fx');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');vib([200,60,200])}
// ---- bridge (shell owns identity, seat tokens, channels)
function onData(m){switch(m.t){
 case'seats':seats=m.seats||[];if(cur=='pick')renderPick();if(cur=='wait')renderWait();break;
 case'denied':seat=-1;started=false;resetEnter();show('pick');renderPick();ov('⛔','المقعد محجوز','اختر مقعداً آخر',2500);break;
 case'ok':seat=m.seat;resetEnter();started=!!m.started;if(started){show('game')}else{show('wait');renderWait()}break;
 case'start':started=true;if(seat>=0){show('game');if(G)renderGame()}break;
 case'st':if(seat<0||!m.pl)break;G=m;G.me=seat;if(!G.hand)G.hand=[];V3.sync(m);if(m.go&&cur!='game')show('game');if(m.turn!==m.me||!m.alive)myTurn=false;if(wasAlive&&!m.alive&&m.go){ov('☠','طارت رصاصتك','تتفرّج على الباقين',3500);fx()}wasAlive=m.alive;renderGame();break;
 case'hand':if(G){G.hand=m.hand||[];renderGame()}break;
 case'a':V3.ev(m);break;
 case'turn':curTid=m.tid|0;if(m.seat===seat&&G&&G.alive){myTurn=true;canCall=m.canCall;timer(m.ms);vib([120,60,120]);renderGame()}break;
 case'log':$('#lgl').textContent=m.m;$('#lgl').style.animation='none';void $('#lgl').offsetWidth;$('#lgl').style.animation='';if(m.m.includes('💥'))fx();break;
 case'rev':V3.ev({k:'rev'});$('#rvc').innerHTML=m.cards.map((c,i)=>card(c,(c==m.table||c=='J'?'ok':'no'))).join('');$('#rvc').querySelectorAll('.cd').forEach((e,i)=>e.style.setProperty('--i',i));$('#rv').classList.add('on');setTimeout(()=>$('#rv').classList.remove('on'),3000);break;
 case'win':V3.ev({k:'win',seat:m.seat});ov(m.seat==seat?'🏆':'👑',m.seat==seat?'أنت الناجي الوحيد!':'الناجي: '+(G?G.pl[m.seat].name:''),'',8000);break}}
function init(d){name=d.name||'لاعب';seat=typeof d.seat=='number'?d.seat:-1;seats=d.seats||[];started=!!d.started;$('#rm').textContent=d.code||room;$('#who').textContent=name;document.getElementById('msg').textContent='';if(seat>=0&&started){show('game')}else if(seat>=0){show('wait');renderWait()}else{show('pick');renderPick()}V3.load()}
addEventListener('message',ev=>{if(ev.origin!==location.origin)return;const d=ev.data;if(!d||d.source!=='icg-shell')return;
 switch(d.type){
  case'icg:ld:init':init(d);break;
  case'icg:ld:seats':onData({t:'seats',seats:d.seats});break;
  case'icg:ld:claimed':onData({t:'ok',seat:d.seat,started:d.started});break;
  case'icg:ld:denied':onData({t:'denied',seats:d.seats});break;
  case'icg:ld:start':onData({t:'start'});break;
  case'icg:ld:pub':{const m=d.m||{};onData(m.type?Object.assign({},m,{t:m.type}):m);break}
  case'icg:ld:hand':onData({t:'hand',hand:d.hand});break;
  case'icg:ld:state':if(d.pub&&d.pub.pl&&d.aliveArr)d.pub.pl.forEach((q,i)=>q.alive=!!d.aliveArr[i]);onData(Object.assign({},d.pub,{t:'st',alive:!!d.alive,hand:Array.isArray(d.hand)?d.hand:(G&&G.hand)||[]}));break;
  case'icg:ld:closed':ov('🚪','أُغلقت الطاولة','شكراً للعب',6000);break;
 }});
addEventListener('click',()=>{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})},{once:true});
