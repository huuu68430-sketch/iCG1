<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>ICG1 – حانة الكذابين</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/liars-den/logo.png"><link rel="apple-touch-icon" href="/liars-den/icon.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#e8c07a;--gold2:#a8793a;--ink:#f6e7c8}
html,body{height:100%;margin:0;overflow:hidden;background:#000;font-family:Tajawal,Tahoma,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%}
.cc canvas{filter:grayscale(.8) contrast(1.25) brightness(1.15) sepia(.3)}
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);background:radial-gradient(ellipse at center,#0000 55%,#000a 100%)}
.top{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center}
.logo{font:800 30px Tajawal;letter-spacing:4px;background:linear-gradient(#fff3d0,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;border:1px solid var(--gold2);padding:2px 14px;border-radius:12px;background-color:#000a}
.ttl{font:800 24px Tajawal;text-shadow:0 2px 12px #000}.ttl small{display:block;font-size:11px;letter-spacing:5px;color:var(--gold);text-align:center}
.badge{background:linear-gradient(#f3d89a,var(--gold2));color:#1a1005;font:800 20px Tajawal;padding:8px 18px;border-radius:14px;box-shadow:0 0 24px #e8c07a55;min-width:110px;text-align:center}
.badge small{display:block;font-size:11px;opacity:.7}
#claim{position:absolute;top:84px;left:50%;transform:translateX(-50%);font:800 26px Tajawal;background:#000b;border:1px solid var(--gold2);padding:8px 26px;border-radius:40px;opacity:0;transition:.3s;white-space:nowrap}
#claim.on{opacity:1}
#log{position:absolute;bottom:128px;left:50%;transform:translateX(-50%);font:500 21px Tajawal;text-shadow:0 2px 10px #000,0 0 3px #000;background:#0009;padding:6px 22px;border-radius:12px;max-width:90vw;text-align:center}
#pl{position:absolute;bottom:14px;left:14px;right:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.p{background:linear-gradient(#1a1209ee,#0b0805ee);border:1px solid #5a4020;border-radius:14px;padding:8px 12px;transition:.3s}
.p.on{border-color:var(--gold);box-shadow:0 0 22px #e8c07a77;transform:translateY(-6px)}
.p.dead{filter:grayscale(1);opacity:.45}
.p b{font:800 18px Tajawal}.p span{font-size:12px;color:var(--gold)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.pips i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-start:3px;background:#2b2216;border:1px solid #6b5230}
.pips i.u{background:#6b1b12;border-color:#c0402c}
#camlab{position:absolute;bottom:108px;left:16px;font:500 12px Tajawal;letter-spacing:2px;color:var(--gold);background:#000a;padding:3px 10px;border-radius:8px}
#cctv{display:none;position:absolute;inset:0;background:repeating-linear-gradient(#0000 0 2px,#0004 2px 3px);font:800 18px monospace;letter-spacing:2px;color:#fff;direction:ltr}
.cc #cctv{display:block}
#cctv b{position:absolute;top:70px;left:22px;color:#ff3b30;animation:bl 1s steps(2) infinite}
#cctv i{position:absolute;top:70px;right:22px;font-style:normal;text-shadow:0 0 4px #000}
#cctv u{position:absolute;bottom:150px;right:22px;text-decoration:none;font-size:14px;opacity:.85}
@keyframes bl{50%{opacity:0}}
#rev{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);display:flex;gap:12px;opacity:0;transition:.35s}
#rev.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.c{width:150px;height:225px;border-radius:14px;box-shadow:0 10px 30px #000b;border:4px solid #fff0}
.c.ok{border-color:#5fd06a}.c.no{border-color:#e0432e}.c small{font-size:36px}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#win{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000c;font:800 56px Tajawal;text-align:center}
#win small{font-size:22px;color:var(--gold)}
@media(max-width:700px){.top .ttl{display:none}#pl{grid-template-columns:repeat(2,1fr)}#log{bottom:196px;font-size:16px}#camlab{bottom:180px}#claim{font-size:18px}.c{width:96px;height:144px}}
.logo{background:none;border:0;padding:0}.logo img{height:46px;display:block;filter:drop-shadow(0 2px 8px #000)}

body:not(.play) #hud{display:none}
#tc{perspective:800px}.tcw{display:flex;align-items:center;gap:12px}
.tcc{position:relative;width:70px;height:105px;transform-style:preserve-3d;animation:tflip 1.2s cubic-bezier(.2,.9,.25,1.15) both,tsway 7s ease-in-out 1.2s infinite;filter:drop-shadow(0 0 14px #e8c07a99)}
.tcc>*{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tcc img{width:100%;height:100%;object-fit:cover;box-shadow:0 8px 24px #000b}
.tcc .bk{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#6e0f1c 0 6px,#8a1a2a 6px 12px);border:3px solid #e0b050;box-shadow:inset 0 0 0 3px #6e0f1c}
.tcc .sh{background:linear-gradient(115deg,#0000 35%,#fff7 50%,#0000 65%);background-size:250% 100%;animation:tsh 3.5s ease-in-out 1.4s infinite;mix-blend-mode:overlay}
@keyframes tflip{from{transform:translateY(-60px) scale(.2) rotateY(-720deg) rotateZ(-20deg);opacity:0}60%{opacity:1}to{transform:none}}
@keyframes tsway{0%,100%{transform:rotateY(-16deg) rotateX(4deg)}50%{transform:rotateY(16deg) rotateX(-4deg) translateY(-3px)}}
@keyframes tsh{from{background-position:150% 0}to{background-position:-150% 0}}
.tct small{display:block;font:700 10px Cinzel,serif;letter-spacing:3px;color:var(--gold)}
.tct b{font:900 36px Cinzel,Georgia,serif;letter-spacing:3px;background:linear-gradient(#fff3d0,#c88f3c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px #000)}
#menu{position:fixed;inset:0;z-index:50;font-family:Tajawal,Tahoma,sans-serif;color:var(--ink);transition:opacity 1s,visibility 1s;background:radial-gradient(ellipse at 50% 40%,#0a050233 0%,#050201cc 70%,#000 125%);backdrop-filter:blur(1.5px)}
#menu.gone{opacity:0;visibility:hidden;pointer-events:none}
.fl{position:absolute;inset:0;overflow:hidden;pointer-events:none}.fl span{position:absolute;bottom:-60px;left:var(--x);font-size:var(--s);color:#e8c07a24;animation:rise var(--d) linear infinite}
@keyframes rise{to{transform:translateY(-120vh) rotate(360deg)}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:16px;padding:20px;overflow:auto;transition:opacity .7s,transform .7s,visibility .7s;text-align:center}
#s2{opacity:0;visibility:hidden;transform:scale(1.04)}#menu.lobby #s1{opacity:0;visibility:hidden;transform:scale(.96)}#menu.lobby #s2{opacity:1;visibility:visible;transform:none}
.lgw{position:relative;width:180px;height:180px;display:grid;place-items:center}.lgw img{width:140px;height:140px;border-radius:50%;filter:drop-shadow(0 0 26px #e8c07a88)}
.lgw:before,.lgw:after{content:'';position:absolute;border-radius:50%;inset:0;border:1px dashed #e8c07a99;animation:spin 26s linear infinite}.lgw:after{inset:12px;border:2px solid #e8c07a22;border-top-color:#e8c07a;animation-duration:7s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.big{font:900 clamp(44px,9vw,104px) Cinzel,Georgia,serif;letter-spacing:.06em;line-height:1;background:linear-gradient(100deg,#8a5a1c 20%,#fff3d0 45%,#e8c07a 55%,#8a5a1c 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 4px 24px #000)}
@keyframes shine{to{background-position:-250% 0}}
.ar{font:800 clamp(22px,3.5vw,34px) Tajawal;letter-spacing:10px;color:#f6e7c8;text-shadow:0 2px 14px #000}
.orn{display:flex;align-items:center;gap:14px;color:var(--gold)}.orn i{width:90px;height:1px;background:linear-gradient(90deg,#0000,#e8c07a)}.orn i:last-child{transform:scaleX(-1)}
.tag{margin:0 0 8px;color:#c9b48a;font:500 18px Tajawal}
.btn{font:800 26px Tajawal;padding:16px 64px;border:0;border-radius:60px;color:#1a1005;background:linear-gradient(#f9e2a8,#c88f3c 60%,#a8793a);box-shadow:inset 0 0 0 2px #fff3d055,0 10px 40px #e8c07a55;cursor:pointer;transition:transform .25s;animation:pulse 2.4s ease-in-out infinite}.btn:hover{transform:scale(1.06)}
@keyframes pulse{50%{box-shadow:inset 0 0 0 2px #fff3d055,0 10px 70px #e8c07acc}}
.hd small{font:700 12px Cinzel,serif;letter-spacing:6px;color:var(--gold)}.hd h2{font:800 clamp(26px,4vw,42px) Tajawal;margin:4px 0 0}
.cnt{font:900 58px Cinzel,Georgia,serif;line-height:1;background:linear-gradient(#fff3d0,#c88f3c);-webkit-background-clip:text;background-clip:text;color:transparent}
.lw{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;max-width:1000px;width:100%}
.qrb{padding:18px;border-radius:22px;background:linear-gradient(#1a1209,#0b0805);border:1px solid #a8793a;box-shadow:0 0 60px #e8c07a33}
#qr{width:220px;height:220px;box-sizing:border-box;padding:12px;background:#f6e7c8;border-radius:12px;position:relative;overflow:hidden;margin:0 auto 10px}#qr img,#qr canvas{width:100%!important;height:100%!important;display:block}
#qr:after{content:'';position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,#0000,#c0402c,#0000);box-shadow:0 0 14px #c0402c;animation:scan 2.4s ease-in-out infinite}@keyframes scan{0%,100%{top:8%}50%{top:92%}}
.qt{font:800 17px Tajawal}.code{font:900 34px Cinzel,serif;letter-spacing:8px;color:var(--gold)}.url{font:500 11px monospace;color:#8a7350;direction:ltr;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#slots{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sl{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:linear-gradient(#1a1209cc,#0b0805cc);border:1px solid #3d2a14;transition:.5s;opacity:.7;text-align:start}
.sl.on{opacity:1;border-color:var(--gold);box-shadow:0 0 30px #e8c07a44;transform:translateY(-4px)}
.sl.bot{opacity:.96;border-color:#7ee08a55;box-shadow:0 0 22px #7ee08a22}.sl.bot .st{color:#9fe6a8;animation:none}
.em{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:var(--c);border:2px solid var(--c);background:#0006;transition:.5s}.sl.on .em{background:var(--c);color:#150c04;box-shadow:0 0 24px var(--c)}
.nm b{display:block;font:800 20px Tajawal}.nm small{font:600 11px Cinzel,serif;letter-spacing:2px;color:var(--gold)}
.st{margin-inline-start:auto;font:800 15px Tajawal;color:#8a7350}.sl:not(.on) .st{animation:blink 1.6s infinite}.sl.on .st{color:#7ee08a}@keyframes blink{50%{opacity:.3}}
.seg{display:flex;gap:8px;width:min(420px,80%)}.seg i{flex:1;height:8px;border-radius:4px;background:#2b2216;transition:.5s}.seg i.on{background:linear-gradient(90deg,#f3d89a,#a8793a);box-shadow:0 0 14px #e8c07a}
.left{font:800 22px Tajawal}.dev{font:500 11px Tajawal;color:#6b5a3e}
#go{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000d;z-index:3}#go small{font:700 16px Cinzel,serif;letter-spacing:8px;color:var(--gold)}#go div{font:900 170px Cinzel,serif;color:#e8c07a;text-shadow:0 0 60px #e8c07a88;animation:pop 1s infinite}@keyframes pop{0%{transform:scale(1.4);opacity:0}30%{opacity:1}100%{transform:scale(.9)}}
@media(max-width:820px){.lw{grid-template-columns:1fr;gap:18px}#slots{grid-template-columns:1fr}#qr{width:180px;height:180px}.tct b{font-size:24px}}
</style></head><body>
<div id="hud">
<div class="top"><div class="logo"><img id="lg" alt="ICG1"></div><div class="ttl">حانة الكذابين<small>LIAR’S DEN</small></div><div id="tc"></div></div>
<div id="cctv"><b>● REC</b><i>CAM 03 · BAR</i><u id="tm"></u></div>
<div id="claim"></div><div id="rev"></div><div id="log"></div><div id="camlab"></div><div id="pl"></div>
<div id="flash"></div><div id="win"></div></div>
<div id="menu"><div class="fl" id="fl"></div>
<section class="scr" id="s1"><div class="lgw"><img id="lgm" alt="ICG1"></div><div class="big">LIAR’S DEN</div><div class="ar">حانة الكذابين</div><div class="orn"><i></i><b>♠ ♥ ♦ ♣</b><i></i></div><p class="tag">أربعة على الطاولة… ورصاصة واحدة تنتظر الكذّاب</p><button class="btn" id="go1">ابدأ اللعبة</button></section>
<section class="scr" id="s2"><div class="hd"><small>LIAR’S DEN</small><h2>بانتظار اللاعبين</h2></div><div class="cnt" id="cnt">0 / 4</div>
<div class="lw"><div class="qrb"><div id="qr"></div><div class="qt">امسح الرمز للانضمام</div><div class="code" id="room"></div><div class="url" id="join"></div></div><div id="slots"></div></div>
<div class="seg" id="seg"></div><div class="left" id="left"></div><button class="btn" id="startNow" style="font-size:22px;padding:12px 44px;margin-top:4px">ابدأ الآن</button><div id="go"></div></section></div>
<script src="/liars-den/vendor/qrcode.min.js"></script>
<script src="/liars-den/vendor/three.min.js"></script>
<script>
const ASSETS={base:'/liars-den/',logo:'logo.png',icon:'icon.png'};
const R=THREE,V=R.Vector3,Y=new V(0,1,0),Z=new V(0,0,1),$=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.floor(Math.random()*n);
const M=(c,r=.8,m=0,e)=>new R.MeshStandardMaterial({color:c,roughness:r,metalness:m,emissive:e||0});
const NM={A:'آص',K:'ملك',Q:'ملكة',J:'جوكر'},SYM={A:'♠',K:'♛',Q:'♕',J:'★'},SR=2;
const scene=new R.Scene();scene.background=new R.Color(0x080403);scene.fog=new R.FogExp2(0x1c0e07,.02);
const cam=new R.PerspectiveCamera(52,1,.25,70),ren=new R.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;ren.shadowMap.type=R.PCFSoftShadowMap;ren.toneMapping=R.ACESFilmicToneMapping;ren.toneMappingExposure=1.2;document.body.prepend(ren.domElement);
function rs(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
function tex(w,h,fn,rep){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));const t=new R.CanvasTexture(c);if(rep){t.wrapS=t.wrapT=R.RepeatWrapping;t.repeat.set(...rep)}t.anisotropy=4;return t}
const sph=(r,c,sx=1,sy=1,sz=1,rg=.6,mt=0,em)=>{const m=new R.Mesh(new R.SphereGeometry(r,24,18),M(c,rg,mt,em));m.scale.set(sx,sy,sz);m.castShadow=true;return m};
const cyl=(rt,rb,h,c,rg=.7,mt=0,sg=28,em)=>{const m=new R.Mesh(new R.CylinderGeometry(rt,rb,h,sg),M(c,rg,mt,em));m.castShadow=true;return m};
const box=(w,h,d,c,rg=.7,mt=0,em)=>{const m=new R.Mesh(new R.BoxGeometry(w,h,d),M(c,rg,mt,em));m.castShadow=true;m.receiveShadow=true;return m};
const tor=(r,t,c,rg=.4,mt=.5,arc)=>{const m=new R.Mesh(new R.TorusGeometry(r,t,10,28,arc||6.283),M(c,rg,mt));m.castShadow=true;return m};
const put=(p,o,x=0,y=0,z=0,rx=0,ry=0,rz=0)=>{o.position.set(x,y,z);o.rotation.set(rx,ry,rz);p.add(o);return o};
// ---------- lights
scene.add(new R.AmbientLight(0x6a4028,1.5));
const spot=new R.SpotLight(0xffc27a,4.5,15,.8,.6,1);spot.position.set(0,4.6,0);spot.target.position.set(0,.9,0);spot.castShadow=true;spot.shadow.mapSize.set(1024,1024);scene.add(spot,spot.target);
const lamp=new R.PointLight(0xffb060,.9,10);lamp.position.set(0,3,0);scene.add(lamp);
[[-9,3.8,-8.5,0xff9a50,2,16],[-2,3.8,-8.5,0xffa860,1.6,14],[8,3.6,-7,0xff9050,1.4,15],[-11,3.4,3,0xffa060,1.5,14],[11,3.4,3,0xffa060,1.5,14],[-3,3.5,9,0xffb36a,1.2,14],[5,3.5,9,0xffb36a,1.2,14]].forEach(([x,y,z,c,i,d])=>{const l=new R.PointLight(c,i,d);l.position.set(x,y,z);scene.add(l)});
const neonL=new R.PointLight(0xff2a20,1,10);neonL.position.set(9,4,-10);scene.add(neonL);
const flashL=new R.PointLight(0xffd080,0,6);scene.add(flashL);
// ---------- room
const XW=15,ZD=11,MA=ren.capabilities.getMaxAnisotropy();
$('#lg').src=ASSETS.base+ASSETS.logo;$('#lg').onerror=function(){this.replaceWith('ICG1')};
const brick=tex(512,256,g=>{g.fillStyle='#24100a';g.fillRect(0,0,512,256);for(let y=0;y<16;y++)for(let x=-1;x<9;x++){g.fillStyle=`hsl(${8+rnd(8)},${38+rnd(16)}%,${15+rnd(9)}%)`;g.fillRect(x*64+(y%2)*32+2,y*16+2,60,12)}for(let i=0;i<500;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.18})`;g.fillRect(rnd(512),rnd(256),2+rnd(8),2+rnd(4))}});
const wood=tex(256,256,g=>{g.fillStyle='#1e0f07';g.fillRect(0,0,256,256);for(let i=0;i<8;i++){g.fillStyle=`hsl(24,${45+rnd(15)}%,${12+rnd(7)}%)`;g.fillRect(0,i*32+1,256,30);g.fillStyle='#0003';for(let k=0;k<5;k++)g.fillRect(rnd(256),i*32+2,1+rnd(2),28)}},[2*XW/3.2,2*ZD/3.2]);wood.anisotropy=MA;
const floor=new R.Mesh(new R.PlaneGeometry(2*XW,2*ZD),new R.MeshStandardMaterial({map:wood,roughness:.45,metalness:.1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
function wall(cx,cz,len,ry){const g=new R.Group(),bt=brick.clone();bt.needsUpdate=true;bt.repeat.set(len/6.4,1);bt.anisotropy=MA;
 const w=new R.Mesh(new R.BoxGeometry(len,6,.4),new R.MeshStandardMaterial({map:bt,roughness:.95}));w.position.set(0,3,-.2);w.receiveShadow=true;g.add(w);
 put(g,box(len,1.3,.12,0x2a1409,.55),0,.65,.06);put(g,box(len,.08,.16,0x4a2610,.4),0,1.34,.08);g.position.set(cx,0,cz);g.rotation.y=ry;scene.add(g)}
wall(0,-ZD,2*XW,0);wall(0,ZD,2*XW,Math.PI);wall(-XW,0,2*ZD+.8,Math.PI/2);wall(XW,0,2*ZD+.8,-Math.PI/2);
const ceil=new R.Mesh(new R.PlaneGeometry(2*XW,2*ZD),M(0x0e0704));ceil.position.y=6;ceil.rotation.x=Math.PI/2;scene.add(ceil);
for(let i=-3;i<=3;i++){const b=box(2*XW,.32,.38,0x1c0e06,.7);b.position.set(0,5.8,i*3.2);scene.add(b)}
[-1,1].forEach(q=>[-7,-1,6].forEach(z=>{put(scene,box(.1,.4,.25,0x3a2410),q*(XW-.1),2.8,z);put(scene,sph(.12,0xffd9a0,1,1.4,1,.3,0,0xffb060),q*(XW-.28),2.8,z)}));
const neon=(txt,col,w,h,fs)=>new R.Mesh(new R.PlaneGeometry(w,h),new R.MeshBasicMaterial({transparent:true,map:tex(512,Math.round(512*h/w),g=>{g.font=`bold ${fs}px Tajawal,Arial`;g.textAlign='center';g.shadowColor=col;g.shadowBlur=26;g.strokeStyle=col;g.lineWidth=5;g.strokeText(txt,256,Math.round(512*h/w)*.7);g.fillStyle='#fff0e8';g.fillText(txt,256,Math.round(512*h/w)*.7)})}));
const TL=new R.TextureLoader();
function logoBoard(x,y,z,ry,k,file){const g=new R.Group();put(g,box(k*2.2,k*2.2,.1,0x2a1409,.4,.2),0,0,.05);put(g,box(k*2,k*2,.04,0x0a0605,.7),0,0,.11);put(g,tor(k*.92,.03,0xb08a3a,.3,.9),0,0,.14);
 const mt=new R.MeshBasicMaterial({color:0,transparent:true,opacity:0,toneMapped:false,polygonOffset:true,polygonOffsetFactor:-2});put(g,new R.Mesh(new R.PlaneGeometry(k*1.7,k*1.7),mt),0,0,.15);
 const ok=t=>{mt.map=t;mt.color.set(0xffffff);mt.opacity=1;mt.needsUpdate=true};

function glowTex(ok){return GLT[ok]||(GLT[ok]=tex(256,256,g=>{const r=g.createRadialGradient(128,128,20,128,128,128),c=ok?'60,255,130':'255,70,50';r.addColorStop(0,`rgba(${c},.0)`);r.addColorStop(.55,`rgba(${c},.55)`);r.addColorStop(1,`rgba(${c},0)`);g.fillStyle=r;g.fillRect(0,0,256,256)}))}
async function reveal(cards){const ms=pile.children.filter(m=>!m.userData.fr).slice(-cards.length),n=ms.length,y=Math.max(1.12,1.04+pile.children.length*.009+.1),SC=1.55,GAP=.76;
 const I=ms.map((m,j)=>({m,c:cards[j],x:(j-(n-1)/2)*GAP,ok:cards[j]==table||cards[j]=='J',s0:m.position.clone(),r0:m.rotation.y}));
 await tween(550,(t,e)=>I.forEach(o=>{o.m.position.set(o.s0.x+(o.x-o.s0.x)*e,o.s0.y+(y-o.s0.y)*e+Math.sin(Math.PI*e)*.15,o.s0.z*(1-e));o.m.rotation.y=o.r0*(1-e);o.m.scale.setScalar(1+(SC-1)*e)}));
 await tween(220,(t,e)=>I.forEach(o=>o.m.scale.x=SC*(1-e)+.03));I.forEach(o=>o.m.material=FM[o.c]);await tween(220,(t,e)=>I.forEach(o=>o.m.scale.x=SC*e+.03*(1-e)));
 const fr=I.map(o=>{const G=new R.Group(),fw=.34*SC+.08,fh=.5*SC+.08;
  const gl=new R.Mesh(new R.PlaneGeometry(fw*1.3,fh*1.2),new R.MeshBasicMaterial({map:glowTex(o.ok),transparent:true,opacity:.3,depthWrite:false,blending:R.AdditiveBlending,toneMapped:false}));gl.rotation.x=-Math.PI/2;gl.position.y=-.012;G.add(gl);
  const f=new R.Mesh(new R.PlaneGeometry(fw,fh),new R.MeshBasicMaterial({map:frameTex(o.ok),transparent:true,toneMapped:false}));f.rotation.x=-Math.PI/2;f.position.y=-.007;G.add(f);
  G.userData.fr=1;G.position.set(o.x,y,0);G.scale.setScalar(.01);pile.add(G);return G});
 await tween(380,(t,e)=>fr.forEach(G=>G.scale.setScalar(Math.max(.01,e*(1+.12*Math.sin(Math.PI*e))))));fr.forEach(G=>G.scale.setScalar(1));await sleep(300)}
async function round(){pile.clear();table='KQA'[rnd(3)];netEv({t:'a',k:'round'});tableCard(table);deal();claim=null;turn=S[starter].alive?starter:nextAlive(starter);panels();roundsPlayed++;
 $log('جولة جديدة — الورقة المطلوبة: '+NM[table]);cut('الأوراق',[0,2.1,1.3],[0,1,0],1900);await sleep(1250);
 while(1){const p=S[turn];panels();faceCut(p.i,1700);$log(p.name+' يفكّر…');await think(p,p.human?900:thinkMs());const d=p.human?await human(p):decide(p);
  if(d.call){const t=claim.p,cards=pile.userData.last,truth=cards.every(c=>c==table||c=='J');
   if(!truth)callWins[p.i]++;
   $('#claim').classList.remove('on');$log(p.name+' يصرخ: كذّاب! 🔥');faceCut(p.i,1500);await callAnim(p,t);
   cut('الكشف',[0,3.1,1.0],[0,1.05,0],7000);$log('الأوراق تنقلب…');netEv({t:'rev',cards,table});await reveal(cards);const loser=truth?p:t;$log(truth?'كان صادقاً! '+p.name+' أخطأ':'كان يكذب! '+t.name+' انكشف');await sleep(1600);
   await spin(loser);starter=loser.alive?loser.i:nextAlive(loser.i);return}
  const cards=d.cards;cards.forEach(c=>p.hand.splice(p.hand.indexOf(c),1));
  handsCut(p,3300);$log(p.name+' يضع '+cards.length+(cards.length>1?' أوراق':' ورقة')+'…');await playAnim(p,cards.length);panels();
  pile.userData.last=cards;claim={p,k:cards.length};const q=$('#claim');q.textContent=`${p.name} يدّعي ${cards.length} × ${NM[table]}`;q.classList.add('on');
  await sleep(430+rnd(370));turn=nextAlive(turn)}}
async function game(){let first=true;while(1){
  if(!first)await waitNextMatch();first=false;
  S.forEach(p=>{p.alive=true;p.pulls=0;p.bullet=rnd(6);p.g.quaternion.copy(p.q0);p.g.position.y=0;p.hand=[];p.ln=0;p.up.rotation.x=0;p.arms.forEach(a=>{a.cur.copy(a.rest);ik(a,a.cur)})});starter=rnd(4);netEv({t:'a',k:'reset'});$('#win').style.display='none';
  callWins=[0,0,0,0];roundsPlayed=0;
  while(alive().length>1)await round();const w=alive()[0];$('#claim').classList.remove('on');pile.clear();faceCut(w.i,9000);
  $('#win').innerHTML=`<small>الناجي الوحيد</small>👑 ${esc(w.name)}`;$('#win').style.display='flex';$log('انتهت اللعبة');netEv({t:'win',seat:w.i});panels();
  post({type:'icg:ld:winner',seat:w.i,calls:callWins.slice(),rounds:roundsPlayed,matchId:matchId});
  await sleep(5200)}}
const QS=new URLSearchParams(location.search);
let ROOM=(QS.get('room')||'').toUpperCase(),JOIN='',matchId='',nextMatch=null,matchPending=false,startPending=false;
function post(m){try{parent.postMessage(Object.assign({source:'icg-ld-host'},m),location.origin)}catch(e){}}
let menuMode=true,started=false,lobbyOn=false,cd=0,cdTimer=null,lbN=0;
const ENM={A:'ACE',K:'KING',Q:'QUEEN',J:'JOKER'};
function tableCard(k){$('#tc').innerHTML=`<div class="tcw"><div class="tcc"><img src="${FU[k]}" alt=""><div class="bk"></div><div class="sh"></div></div><div class="tct"><small>TABLE CARD</small><b>${ENM[k]}</b></div></div>`}
const CH=[['♠','#e8c07a','The Mastermind'],['♥','#e0584a','The Jewel'],['♦','#6ec6a0','The Doctor'],['♣','#b8c46a','The General']],LT=['','شخصية واحدة','شخصيتان','3 شخصيات','4 شخصيات'];
$('#slots').innerHTML=S.map((p,i)=>`<div class="sl" id="sl${i}"><div class="em" style="--c:${CH[i][1]}">${CH[i][0]}</div><div class="nm"><b>${p.n}</b><small>${CH[i][2]}</small></div><div class="st">شاغر</div></div>`).join('');
$('#fl').innerHTML=Array.from({length:12},(_,i)=>`<span style="--x:${rnd(96)}%;--d:${14+rnd(14)}s;--s:${22+rnd(34)}px;animation-delay:-${rnd(20)}s">${'♠♥♦♣'[i%4]}</span>`).join('');
$('#lgm').src=ASSETS.base+ASSETS.logo;$('#lgm').onerror=function(){this.style.display='none'};

/* ===== الجسر مع القشرة: لوبي + بدء + مقاعد + أفعال ===== */
let readyCode='';
function setCfg(d){
  if(d&&d.code)ROOM=String(d.code).toUpperCase();
  JOIN=(d&&d.join)||(location.origin+'/ld='+ROOM);
  $('#join').textContent=JOIN.replace(/^https?:\/\//,'');$('#room').textContent=ROOM;
  if(!lobbyOn)enterLobby();
  if(readyCode===ROOM)return;
  readyCode=ROOM;
  post({type:'icg:ld:ready',code:ROOM});
}
function enterLobby(){
  if(lobbyOn)return;lobbyOn=true;
  $('#menu').classList.add('lobby');
  try{if(window.QRCode&&!$('#qr').firstChild)new QRCode($('#qr'),{text:JOIN,width:220,height:220,colorDark:'#1a1005',colorLight:'#f6e7c8',correctLevel:QRCode.CorrectLevel.M})}catch(e){}
  LB.upd();
}
function begin(){if(started||startPending)return;startPending=true;post({type:'icg:ld:startreq'})}
function onStartAck(d){
  if(started)return;started=true;startPending=false;matchId=String((d&&d.matchId)||'');
  clearTimeout(cdTimer);cd=0;$('#go').style.display='none';
  menuMode=false;$('#menu').classList.add('gone');document.body.classList.add('play');
  game();
}
/* قد تصل إشارة المباراة القادمة أثناء عرض الفائز (قبل أن ننتظرها) — لا تُفقد الإشارة */
function waitNextMatch(){if(matchPending){matchPending=false;return Promise.resolve()}return new Promise(r=>{nextMatch=r})}
function onMatch(d){matchId=String((d&&d.matchId)||'');if(nextMatch){const r=nextMatch;nextMatch=null;r()}else matchPending=true}

function countdown(){if(cd||started)return;let n=5;const g=$('#go');g.style.display='flex';cd=1;
  (function t(){if(started){cd=0;g.style.display='none';return}
    if(!n){cd=0;g.style.display='none';begin();return}
    g.innerHTML=`<small>THE GAME BEGINS</small><div>${n}</div>`;n--;cdTimer=setTimeout(t,1000)})()}
const LB={upd(){const n=S.filter(p=>p.human).length;$('#cnt').textContent=n+' / 4';S.forEach((p,i)=>{const e=$('#sl'+i);if(!e)return;e.classList.toggle('on',p.human);e.classList.toggle('bot',!p.human&&n>=1);e.querySelector('.st').textContent=p.human?'✓ '+p.name:(n>=1?'بوت جاهز':'شاغر')});
 $('#seg').innerHTML=S.map(p=>`<i class="${p.human?'on':''}"></i>`).join('');
 $('#left').textContent=n<4?(n>=1?'البوتات تملأ المقاعد وتلعب فوراً':'باقي '+LT[4-n]):'اكتمل العدد!';
 const st=$('#startNow');if(st)st.disabled=n<1||started;
 /* يبدأ اللعب تلقائياً فور دخول أول لاعب — البوتات تملأ الباقي وتلعب معه بلا انتظار */
 if(n>=1&&lobbyOn&&!started&&!startPending){if(!cd)countdown();else if(n!==lbN){clearTimeout(cdTimer);cd=0;countdown()}}
 if(n<1&&cd&&!started){cd=0;clearTimeout(cdTimer);$('#go').style.display='none'}
 lbN=n}};

/* تحديث المقاعد من قاعدة البيانات — الهوية والحجز في السيرفر */
function applySeats(list){
  if(!Array.isArray(list))return;
  S.forEach((p,i)=>{
    const s=list[i],was=!!p.human;
    p.human=!!(s&&s.taken);
    p.name=p.human?(String(s.name||'').trim().slice(0,14)||p.n):p.n;
    if(was&&!p.human&&p.wait){const w=p.wait;p.wait=null;p.tid=0;clearTimeout(p.tm);w(decide(p))}
  });
  panels();LB.upd();
}

/* ===== الشبكة: القشرة تحمل Broadcast، والمحرك يرسل أحداثه فقط ===== */
function netEv(m){if(!ROOM)return;post({type:'icg:ld:pub',m})}
function netPush(){if(!ROOM)return;
  post({type:'icg:ld:state',
    pub:{t:'st',table,turn,claim:claim?{by:claim.p.i,k:claim.k}:null,pl:S.map(p=>({n:p.n,name:p.name,alive:p.alive,pulls:p.pulls,cards:p.hand.length,human:!!p.human})),go:started},
    hands:S.map(p=>p.hand.slice()),alive:S.map(p=>!!p.alive)})}
let turnSeq=0;
function human(p){return new Promise(res=>{
  const tid=++turnSeq;p.tid=tid;
  const done=r=>{if(p.tid!==tid)return;p.tid=0;clearTimeout(p.tm);p.wait=null;res(r)};
  p.wait=r=>{if(p.tid===tid)done(r)};
  p.tm=setTimeout(()=>done(decide(p)),30000);
  post({type:'icg:ld:turn',seat:p.i,tid,ms:30000,canCall:!!claim})})}
function applyAct(seat,tid,m){
  const p=S[seat|0];
  if(!p||!p.wait||p.tid!==(tid|0))return;
  if(m&&m.call&&claim)return p.wait({call:true});
  const ix=[...new Set((m&&m.ix)||[])].filter(k=>Number.isInteger(k)&&k>=0&&k<p.hand.length).slice(0,3);
  if(ix.length)p.wait({cards:ix.map(k=>p.hand[k])})}

addEventListener('message',ev=>{
  if(ev.origin!==location.origin)return;
  const d=ev.data;if(!d||d.source!=='icg-shell')return;
  if(d.type==='icg:ld:cfg')setCfg(d);
  else if(d.type==='icg:ld:seats')applySeats(d.seats);
  else if(d.type==='icg:ld:act')applyAct(d.seat,d.tid,d.act);
  else if(d.type==='icg:ld:startack')onStartAck(d);
  else if(d.type==='icg:ld:startfail'){startPending=false;$log('تعذّر بدء المباراة — أعد المحاولة')}
  else if(d.type==='icg:ld:match')onMatch(d);
});

$('#go1').onclick=enterLobby;
const sn=$('#startNow');if(sn)sn.onclick=begin;
if(ROOM)setCfg({code:ROOM});else LB.upd();
post({type:'icg:ld:ready',code:ROOM});

addEventListener('keydown',e=>{if(e.key==' '){ov=null;setShot(pick(),performance.now())}});
setShot(0,0);cam.position.set(0,7,.01);panels();requestAnimationFrame(loop);
</script></body></html>
