<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المافيا — iCG1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#d11f33;--red2:#7d0f1c;--gold:#e8be6e;--cr:#fbeccb;--mut:#a79a9a;--ink:#07060b;--doc:#20c9a6;--eld:#f0c25a;--cit:#4fa3ff;--dsp:"Baloo Bhaijaan 2",Tajawal,sans-serif;color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:#07060b;color:var(--cr);font:500 16px/1.6 Tajawal,Tahoma,sans-serif;overflow-x:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;stroke-width:1.9}.ic.f{fill:color-mix(in srgb,currentColor 25%,transparent)}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 28px;border-radius:16px;font:italic 800 20px var(--dsp);border:1px solid rgba(232,190,110,.5);background:rgba(255,255,255,.06);transition:.2s}
.btn.p{background:linear-gradient(180deg,#f9e0a4,#c08b3a);color:#1a1006;border-color:#ffe9b0;box-shadow:0 8px 26px rgba(232,190,110,.3)}.btn.r{background:linear-gradient(180deg,#f0394e,#a8142a);border-color:#ff8a98;box-shadow:0 8px 26px rgba(209,31,51,.4)}
.btn:hover:not(:disabled){transform:translateY(-2px)}.btn:disabled{opacity:.4;cursor:not-allowed}
.av{flex:none;display:inline-grid;place-items:center;width:var(--s,40px);height:var(--s,40px);border-radius:50%;background:linear-gradient(150deg,#fff,var(--c,#e8be6e));border:2px solid rgba(255,255,255,.5);color:#1a1006;font:800 calc(var(--s,40px)*.5)/1 var(--dsp);box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent)}.av i{font-style:normal;padding-bottom:2px}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);opacity:0;z-index:90;padding:11px 24px;border-radius:14px;background:rgba(10,8,12,.97);border:1px solid var(--gold);font-weight:800;transition:.3s;pointer-events:none;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
/* ===== المنصة (الشاشة الكبيرة) ===== */
.stg{position:relative;height:100vh;min-height:640px;display:flex;flex-direction:column;background:#07060b url(mafia/stage-bg.jpeg) center/cover no-repeat;overflow:hidden;transition:filter 1.2s}
.stg::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 40%,rgba(7,6,11,.55),rgba(7,6,11,.92));transition:.8s}
.sky{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.4s}
body.night .sky{opacity:1}body.night .stg::before{background:radial-gradient(80% 60% at 50% 40%,rgba(3,3,10,.82),rgba(2,2,6,.97))}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.6px 1.6px at 12% 18%,#fff 50%,transparent),radial-gradient(1.2px 1.2px at 28% 8%,#fff 50%,transparent),radial-gradient(1.6px 1.6px at 44% 22%,#fff 50%,transparent),radial-gradient(1.2px 1.2px at 63% 10%,#fff 50%,transparent),radial-gradient(1.6px 1.6px at 78% 20%,#fff 50%,transparent),radial-gradient(1.2px 1.2px at 90% 7%,#fff 50%,transparent),radial-gradient(1px 1px at 8% 40%,#fff 50%,transparent),radial-gradient(1px 1px at 95% 38%,#fff 50%,transparent),radial-gradient(1px 1px at 54% 4%,#fff 50%,transparent);animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:.95}}
.moon{position:absolute;top:70px;left:11%;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 36% 34%,#fffbe8,#e5dcc0 55%,#a79e83);box-shadow:0 0 70px 18px rgba(255,248,214,.22);animation:fl 7s ease-in-out infinite alternate}
.moon::after{content:"";position:absolute;inset:18% 56% 56% 18%;border-radius:50%;background:rgba(120,110,90,.3);box-shadow:36px 40px 0 6px rgba(120,110,90,.22)}
@keyframes fl{to{transform:translateY(12px)}}
.fog{position:absolute;left:-20%;right:-20%;height:38%;bottom:0;background:radial-gradient(60% 100% at 30% 100%,rgba(150,160,190,.18),transparent),radial-gradient(50% 90% at 75% 100%,rgba(150,160,190,.14),transparent);animation:dr 24s linear infinite alternate}.fog.b{bottom:12%;opacity:.7;animation-duration:36s;animation-direction:alternate-reverse}
@keyframes dr{to{transform:translateX(12%)}}
.glow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s;z-index:1}
body[data-g=mafia] .glow{opacity:1;background:radial-gradient(60% 50% at 50% 50%,rgba(209,31,51,.32),transparent 70%);animation:pl 1.6s ease-in-out infinite alternate}
body[data-g=doctor] .glow{opacity:1;background:radial-gradient(60% 50% at 50% 50%,rgba(32,201,166,.28),transparent 70%);animation:pl 2s ease-in-out infinite alternate}
body[data-g=elder] .glow{opacity:1;background:radial-gradient(60% 50% at 50% 50%,rgba(240,194,90,.28),transparent 70%);animation:pl 2s ease-in-out infinite alternate}
body[data-g=op] .glow{opacity:1;background:radial-gradient(70% 60% at 50% 50%,rgba(209,31,51,.3),transparent 72%);animation:pl .6s ease-in-out infinite alternate}
@keyframes pl{to{opacity:.45}}
.sh{position:relative;z-index:3;display:flex;align-items:center;gap:12px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font:italic 800 26px var(--dsp);margin-inline-end:auto}.brand img{width:40px;height:40px;border-radius:50%;border:1px solid rgba(232,190,110,.6)}.brand small{font:700 13px Tajawal;color:var(--mut);font-style:normal}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;font:italic 800 18px var(--dsp);background:rgba(0,0,0,.5);border:1px solid rgba(232,190,110,.4)}
.tmr{position:relative;width:54px;height:54px;display:grid;place-items:center}.tmr svg{position:absolute;inset:0;transform:rotate(-90deg)}.tmr b{font:800 18px var(--dsp)}
.tl{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;color:var(--gold);background:rgba(0,0,0,.5);border:1px solid rgba(232,190,110,.35)}.tl:hover{background:var(--gold);color:#1a1006}
.sm{position:relative;z-index:2;flex:1;min-height:0;display:flex;gap:14px;padding:0 20px 16px}
.tbl{position:relative;flex:1;min-width:0}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46%;max-height:62%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;z-index:3}
.core h2{margin:0;font:italic 800 clamp(30px,4.2vw,64px)/1.35 var(--dsp);text-shadow:0 4px 30px rgba(0,0,0,.8);animation:rs .7s cubic-bezier(.2,1,.3,1)}
@keyframes rs{from{opacity:0;transform:translateY(24px) scale(.94)}}
.core p{margin:0;font-size:clamp(14px,1.5vw,22px);color:#d8cbcb;font-weight:700}
.big{font-size:clamp(54px,7vw,110px);line-height:1;filter:drop-shadow(0 0 26px currentColor)}.big .ic{width:1em;height:1em;stroke-width:1.4}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:calc(var(--sz)*1.7);transition:opacity .6s,filter .6s,transform .4s}
.seat .av{--s:var(--sz)}.seat span.nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:800 clamp(11px,1.15vw,17px) Tajawal;padding:1px 10px;border-radius:999px;background:rgba(0,0,0,.6)}
.seat.new{animation:pp .5s cubic-bezier(.2,1.5,.4,1)}@keyframes pp{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}}
.seat.dead{opacity:.4;filter:grayscale(1)}.seat.dead .av::after{content:"✖";position:absolute;font-size:calc(var(--sz)*.6);color:#ff4a5a}.seat .av{position:relative}
.seat .bd{position:absolute;top:-6px;left:50%;margin-left:calc(var(--sz)*.18);min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--red);font:800 15px/24px var(--dsp);text-align:center;box-shadow:0 0 12px var(--red)}
.seat .ok{position:absolute;top:-4px;right:6px;width:22px;height:22px;border-radius:50%;background:#2fd47a;display:grid;place-items:center;color:#fff;font-size:13px}
.seat .cb{position:absolute;top:calc(var(--sz)*-.12);width:calc(var(--sz)*.62);aspect-ratio:3/4;border-radius:6px;background:linear-gradient(135deg,#7d0f1c,#2a0a10);border:1px solid var(--gold);box-shadow:0 0 12px rgba(232,190,110,.5);animation:dl .9s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i)*.14s)}
@keyframes dl{from{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.5)}}
body.night .seat{opacity:.55}body.night .seat .nm{background:rgba(0,0,0,.4)}body.night .seat.dead{opacity:.25}
.seat.hit .av{animation:ht 1.4s ease-out}@keyframes ht{0%,100%{box-shadow:0 0 14px transparent}30%,70%{box-shadow:0 0 40px 10px rgba(209,31,51,.8)}}
.qrb{background:#fff;border-radius:18px;padding:10px;width:min(230px,26vw);aspect-ratio:1;display:grid;place-items:center;box-shadow:0 0 50px rgba(232,190,110,.3)}.qrb img{width:100%;image-rendering:pixelated}
.code{font:800 clamp(26px,3vw,44px)/1 var(--dsp);letter-spacing:6px;color:var(--gold);direction:ltr}
.lnk{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;font:700 13px Tajawal;color:#9fb0c8}
.sc{flex:none;width:min(320px,24vw);display:none;flex-direction:column;gap:6px;padding:12px;border-radius:20px;background:rgba(0,0,0,.55);border:1px solid rgba(232,190,110,.3);backdrop-filter:blur(6px);max-height:100%;overflow:hidden}
body[data-ph=day] .sc{display:flex}.sc h4{margin:0 0 4px;font:800 15px Tajawal;color:var(--gold)}.sc .ms{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:600;animation:rs .35s}.sc .ms b{color:var(--gold)}
.ln{margin-top:6px;padding:4px 14px;border-radius:12px;background:rgba(209,31,51,.2);border:1px solid rgba(209,31,51,.5);font-weight:800;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%;max-height:100%;overflow:auto;padding:6px}
/* بطاقة الدور */
.rc{--rc:var(--cit);position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(170deg,color-mix(in srgb,var(--rc) 35%,#0b0a12),#07060b 85%);border:2px solid var(--rc);box-shadow:0 0 30px color-mix(in srgb,var(--rc) 40%,transparent),inset 0 0 40px color-mix(in srgb,var(--rc) 18%,transparent);text-align:center}
.rc.mafia{--rc:var(--red)}.rc.doctor{--rc:var(--doc)}.rc.elder{--rc:var(--eld)}.rc.citizen{--rc:var(--cit)}
.rc .ch{display:block;width:100%;aspect-ratio:200/200;margin-top:6px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.rc .rn{display:block;padding:6px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--rc) 55%,#000));font:italic 800 clamp(20px,2vw,30px)/1.4 var(--dsp)}
.rc .pn{display:block;padding:3px 8px 8px;font-weight:800;font-size:14px;background:rgba(0,0,0,.45)}
.rc.sm .ch{aspect-ratio:200/190}
.ejc{animation:slam .7s cubic-bezier(.2,1.4,.3,1)}@keyframes slam{from{opacity:0;transform:scale(2.2) rotate(-8deg)}}
.lst{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.dp{display:none;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.85);place-items:center;padding:16px}.dp.on{display:grid}.dp .bx{width:min(520px,100%);padding:24px;border-radius:24px;background:#12101a;border:1px solid var(--gold);text-align:center;display:flex;flex-direction:column;gap:10px}
.dp .lk{padding:10px;border-radius:12px;background:#000;direction:ltr;font:700 13px Tajawal;word-break:break-all;color:#ffd98a}
/* ===== الهاتف ===== */
.ph{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 14px 30px;text-align:center;background:radial-gradient(120% 70% at 50% 0%,#241020,#07060b 70%);transition:background .8s}
.ph.night{background:radial-gradient(120% 70% at 50% 0%,#0a0a1c,#020207 75%)}.ph.mafia{background:radial-gradient(120% 70% at 50% 0%,#4a0a14,#0a0204 75%)}.ph.doctor{background:radial-gradient(120% 70% at 50% 0%,#07352d,#020a09 75%)}.ph.elder{background:radial-gradient(120% 70% at 50% 0%,#3a2d0a,#0a0802 75%)}.ph.dead{background:#0b0b0e;filter:grayscale(.7)}
.ph h1{margin:6px 0;font:italic 800 clamp(30px,8vw,42px)/1.4 var(--dsp)}.ph p{margin:4px 0;color:#cdbfc0}
.ph .tp{display:flex;align-items:center;gap:10px;width:100%;max-width:480px;margin-bottom:8px}.ph .tp .chip{margin-inline-start:auto}
.inp{width:100%;max-width:420px;padding:14px;border-radius:16px;background:rgba(0,0,0,.45);border:1px solid rgba(232,190,110,.5);font:800 20px Tajawal;text-align:center}
.pb{width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;align-items:center}
.tg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}
.tt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;font-weight:800;font-size:15px;text-align:right;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);transition:.2s}.tt span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt:hover:not(:disabled){border-color:#fff}.tt.sel{background:linear-gradient(135deg,var(--ac,#d11f33),#000 160%);border-color:#fff;box-shadow:0 0 18px var(--ac,#d11f33)}.tt .n{font:800 13px Tajawal;color:#ffb3bb}
.chat{width:100%;display:flex;flex-direction:column;gap:6px;max-height:34vh;min-height:110px;overflow:auto;padding:10px;border-radius:16px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);text-align:right}
.chat div{font-size:14px;font-weight:600;animation:rs .3s}.chat b{color:var(--gold)}.chat .sy{color:#ff9aa6;font-weight:800}
.row{display:flex;gap:8px;width:100%}.row .inp{flex:1;font-size:16px;padding:11px}
.tabs{display:flex;gap:6px;width:100%}.tabs button{flex:1;padding:10px;border-radius:12px;font-weight:800;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2)}.tabs button.on{background:var(--ac);border-color:#fff;color:#000}
.fl{perspective:1200px;width:min(300px,78vw);margin:10px auto}.fi{position:relative;aspect-ratio:3/4.3;transition:transform 1.1s cubic-bezier(.2,.9,.3,1);transform-style:preserve-3d}.fi.on{transform:rotateY(180deg)}
.fi>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px}.fi .bk{display:grid;place-items:center;background:repeating-linear-gradient(45deg,#2a0a10 0 10px,#1a070b 10px 20px);border:3px solid var(--gold);box-shadow:0 0 40px rgba(232,190,110,.35)}.fi .bk b{font:800 90px var(--dsp);color:var(--gold);text-shadow:0 0 30px var(--gold)}
.fi .ft{transform:rotateY(180deg)}.fi .ft .rc{height:100%;display:flex;flex-direction:column}.fi .ft .rc .ch{flex:1;min-height:0;margin:0;aspect-ratio:auto;height:auto}
.burst{position:absolute;inset:-30%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 8%,color-mix(in srgb,var(--rc) 40%,transparent) 10%,transparent 14% 24%,color-mix(in srgb,var(--rc) 40%,transparent) 26%,transparent 30% 40%,color-mix(in srgb,var(--rc) 40%,transparent) 42%,transparent 46% 56%,color-mix(in srgb,var(--rc) 40%,transparent) 58%,transparent 62% 72%,color-mix(in srgb,var(--rc) 40%,transparent) 74%,transparent 78% 88%,color-mix(in srgb,var(--rc) 40%,transparent) 90%,transparent 94%);animation:sp 14s linear infinite;opacity:.6;-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 66%);mask-image:radial-gradient(circle,#000 20%,transparent 66%)}
.zz{font-size:70px;opacity:.7;animation:fl 3s ease-in-out infinite alternate}
.note2{padding:8px 14px;border-radius:12px;font-weight:700;font-size:14px;color:#ffd98a;background:rgba(255,200,80,.08);border:1px solid rgba(255,200,80,.3)}
/* ===== الهوست ===== */
.hs{max-width:980px;margin:0 auto;padding:16px 14px 40px}.hs h1{margin:0 0 4px;font:italic 800 32px var(--dsp)}
.cd{padding:16px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(232,190,110,.3);margin-bottom:12px}.cd h3{margin:0 0 10px;font:800 16px Tajawal;color:var(--gold);display:flex;align-items:center;gap:8px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.fld{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.3);font-weight:700;font-size:14px}.fld .st{display:flex;align-items:center;gap:8px;direction:ltr}.fld .st button{width:30px;height:30px;border-radius:9px;background:rgba(232,190,110,.15);border:1px solid rgba(232,190,110,.4);color:var(--gold)}.fld .st b{min-width:34px;text-align:center;font:800 18px var(--dsp)}
.sw{width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.2);position:relative}.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:#2fa86a}.sw.on::after{right:23px}
.hp{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:rgba(0,0,0,.3);font-weight:800;font-size:14px}.hp .rt{margin-inline-start:auto;font-size:12px;padding:1px 10px;border-radius:999px;background:rgba(255,255,255,.1)}.hp.mafia .rt{background:var(--red)}.hp.doctor .rt{background:var(--doc);color:#000}.hp.elder .rt{background:var(--eld);color:#000}.hp.citizen .rt{background:var(--cit);color:#000}.hp.d{opacity:.45;text-decoration:line-through}.hp .kk{color:#ff8a98;padding:2px 6px}
.hl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.lg{max-height:170px;overflow:auto;font-size:13px;font-weight:600;color:#cfc2c2;display:flex;flex-direction:column;gap:3px}
@media(max-width:900px){.sc{display:none!important}.core{width:70%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.rc .ch{aspect-ratio:200/240}.rc.sm .ch{aspect-ratio:200/230}.rc .burst{z-index:0}.rc .ch,.rc .rn,.rc .pn{position:relative;z-index:1}.core.wide{width:96%;max-height:96%;justify-content:flex-start;overflow:auto;top:50%}.core.wide h2{font-size:clamp(26px,3vw,46px)}.seat.dead .av{position:relative}
/* ===== V2: تصميم سينمائي ===== */
.stg::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(1.2px 1.2px at 10% 80%,#ffd98a88 50%,transparent),radial-gradient(1.5px 1.5px at 30% 60%,#ffd98a66 50%,transparent),radial-gradient(1.2px 1.2px at 55% 85%,#ffd98a88 50%,transparent),radial-gradient(1.5px 1.5px at 78% 70%,#ffd98a66 50%,transparent),radial-gradient(1.2px 1.2px at 92% 90%,#ffd98a88 50%,transparent);background-size:100% 100%;animation:dust 9s linear infinite}@keyframes dust{from{transform:translateY(0);opacity:.9}to{transform:translateY(-14vh);opacity:0}}
.stg>header{backdrop-filter:blur(8px);background:linear-gradient(180deg,#000b,transparent)}
.lb{display:flex;flex-direction:column;align-items:center;gap:10px}
.neon{font:italic 800 clamp(44px,6.4vw,104px)/1.1 var(--dsp);color:#ffe9b8;text-shadow:0 0 8px #ffc766,0 0 28px #e0314c,0 0 70px #e0314c;animation:nf 3.4s infinite}@keyframes nf{0%,100%{opacity:1}6%{opacity:.55}8%{opacity:1}52%{opacity:.8}54%{opacity:1}}
.lb small{letter-spacing:5px;color:var(--gold);font-weight:800;margin-top:-6px}
.fan{display:flex;gap:10px;justify-content:center;margin:2px 0 4px}.fan .rc{width:clamp(78px,8.4vw,124px);animation:fl 3.2s ease-in-out infinite alternate;animation-delay:calc(var(--k)*-.7s);transform:rotate(calc((var(--k) - 1.5)*5deg))}
.fan .rc .rn{font-size:clamp(13px,1.3vw,20px)}.fan .rc .pn{display:none}
.tkt{display:flex;gap:18px;align-items:center;padding:12px 20px;border-radius:22px;background:linear-gradient(135deg,#2a0d14dd,#0b0710ee);border:1px solid var(--gold);box-shadow:0 0 50px #e8be6e44,inset 0 0 30px #e8be6e1a;position:relative}

<script>
/* ===== بوتات المدير: 4 كحد أقصى ===== */
(function(){
const MAXB=4,BN=["سلطان","نورة","فهد","ريم"];
const botCount=()=>G.P.filter(p=>p.bot).length;
function addBots(){
 if(G.ph!=="join")return;
 let left=Math.min(MAXB-botCount(),CFG.max-G.P.length);
 for(let i=0;i<left;i++){
  const used=new Set(G.P.map(p=>p.name.toLowerCase()));
  const name=BN.find(n=>!used.has(n.toLowerCase()));
  if(!name)break;
  const p=addP(name,null);
  if(!p)break;
  p.bot=true;lg(name+" (بوت) انضم");
 }
 drawStage();pubAll();hostSync();
}
if(MODE==="s"){
 const _ocb=onCmd;
 onCmd=function(m){if(m.c==="bots"){addBots();return}return _ocb(m)};
 const _ad=afterDeal;
 afterDeal=function(){G.P.forEach(p=>{if(p.bot)p.ready=true});return _ad()};
 const pk=a=>a.length?a[Math.floor(Math.random()*a.length)]:null;
 const _en=enter;
 const allBot=a=>a.length&&a.every(p=>p.bot);
 const soon=(st,ms)=>setTimeout(()=>{if(G.ph==="night"&&G.st===st)next()},ms);
 enter=function(ph,st){
  _en(ph,st);
  const B=G.P.filter(p=>p.bot&&p.alive);
  if(!B.length)return;
  if(ph==="night"&&st==="mafia"){
   /* البوتات تتفق على ضحية واحدة وإلا انتظر الليل كامل المدة */
   const maf=B.filter(p=>p.role==="mafia"),t=pk(alive().filter(x=>x.role!=="mafia"));
   if(t)maf.forEach(p=>{G.nt.mv[p.id]=t.id});
   if(maf.length&&ofr("mafia").every(x=>G.nt.mv[x.id]))soon("mafia",700);
  }else if(ph==="night"&&st==="doctor"){
   const d=B.find(p=>p.role==="doctor"),t=d&&pk(alive());
   if(t){G.nt.protect=t.id;if(allBot(ofr("doctor")))soon("doctor",800)}
  }else if(ph==="night"&&st==="elder"){
   const e=B.find(p=>p.role==="elder"),t=e&&pk(alive().filter(x=>x.id!==e.id));
   if(t){G.nt.silence=t.id;if(allBot(ofr("elder"))&&(!G.cfg.invest||G.usedInv))soon("elder",800)}
  }else if(ph==="day"&&st==="vote"){
   B.forEach(p=>{const t2=pk(alive().filter(x=>x.id!==p.id));G.votes[p.id]=t2?t2.id:"skip"});
   if(alive().every(x=>G.votes[x.id]))setTimeout(()=>{if(G.st==="vote")next()},800);
  }
 };
}

  b.innerHTML=ic("users")+" "+(old?"إضافة بوتات — حدّث الشاشة":"إضافة بوتات ("+n+"/4)");

  b.onclick=()=>{

  const rows=document.querySelectorAll("#app .pls2 .pc2");

   if(nm&&!nm.querySelector(".btg")){const s=document.createElement("i");s.className="btg";s.textContent="بوت";nm.appendChild(s)}});
 };

}
})();

<script>
/* ===== V7: تأكيد القرار + الخارجون + لوحة المدير الحيّة ===== */
(function(){
/* ---------- الجوال: شريط التأكيد (اختيار الهدف وحده لا يسجّل قراراً) ---------- */
if(MODE==="p"){
 const VERB={kill:"قتل",protect:"حماية",silence:"إسكات",invest:"تحقيق مع",probe:"تحقيق مع",vote:"تصويت"};
 const bar=document.createElement("div");bar.id="cfm";bar.className="cfmb";document.body.appendChild(bar);
 const nm=id=>{const t=((P.pub||{}).pl||[]).find(x=>x.i===id);return t?t.n:"?"};
 /* P.act.k هو نوع المرحلة، ونوع القرار على الشبكة يأتي من الزر نفسه (kill/protect/vote…) */
 function drawBar(){const a=P.act;if(!a||!a.k){bar.classList.remove("on");return}
  const done=a.my&&!P.editing;
  bar.className="cfmb"+(done?" ok":"");
  if(done){bar.classList.add("on");
   bar.innerHTML=`<div class="lb">✓ قرارك مسجّل: <b>${esc(a.my==="skip"?"التجاوز":nm(a.my))}</b><small style="display:block;color:#a79a9a;font-size:11.5px">بانتظار بقية القرارات</small></div>`+
    (a.k==="detective"?"":`<button class="no2" data-a="cfmno">تغيير</button>`);return}
  if(P.pick==null){
   if(P.editing){bar.classList.add("on");
    bar.innerHTML=`<div class="lb">اختر لاعباً جديداً ثم أكّد — قرارك الحالي <b>${esc(a.my==="skip"?"التجاوز":nm(a.my))}</b> يبقى محسوباً حتى يُبدَّل</div><button class="no2" data-a="cfmcn">إلغاء التغيير</button>`}
   else bar.classList.remove("on");return}
  bar.classList.add("on");
  bar.innerHTML=`<div class="lb">تأكيد ${VERB[P.pickK]||""}: <b>${esc(P.pick==="skip"?"التجاوز":nm(P.pick))}</b></div><button class="yes" data-a="cfmyes">تأكيد</button><button class="no2" data-a="cfmcn">إلغاء</button>`}
 const commit=()=>{if(P.pick==null||!P.pickK)return;
  if(P.act)P.act.my=P.pick;P.editing=false;
  SY.tx({t:"act",pid:P.pid,kind:P.pickK,target:P.pick,to:"stage"});P.pick=null;P.pickK="";drawBar();render()};
 /* يلتقط الضغط قبل بقية المستمعين: لا يُرسَل أي قرار بلا تأكيد */
 window.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest('[data-a="act"],[data-k="probe"]');
  if(!b){const y=e.target.closest&&e.target.closest('[data-a="cfmyes"],[data-a="cfmno"],[data-a="cfmcn"]');
   if(!y)return;e.stopPropagation();e.preventDefault();
   if(y.dataset.a==="cfmyes")commit();
   else if(y.dataset.a==="cfmno"){P.editing=true;P.pick=null;P.pickK="";drawBar()}
   else{P.editing=false;P.pick=null;P.pickK="";drawBar()}return}
  e.stopPropagation();e.preventDefault();
  P.editing=false;P.pickK=b.dataset.k||"probe";P.pick=b.dataset.t;
  document.querySelectorAll(".tg .tt").forEach(x=>x.classList.toggle("sel",x===b));drawBar()},true);
 /* كل مرحلة جديدة تُسقط الاختيار المعلّق وقرار المرحلة السابقة */
 SY.fns.push(m=>{if(m.t!=="pub")return;
  if(m.ph+":"+m.st!==P.step7){P.step7=m.ph+":"+m.st;P.pick=null;P.pickK="";P.editing=false;if(P.act)P.act.my=null}
  drawBar()});
 const outH=s=>((s.out||[]).length?`<div class="pv2"><span style="opacity:.7">خرجوا:</span>${s.out.map(x=>`<span>${esc(x.n)} <b>${x.w}</b></span>`).join("")}</div>`:"");
 /* الأصوات الحيّة + الخارجون على شاشة الجوال: تُحقن فقط في شاشة القرار نفسها، لا في اللوبي */
 const _v7=view;view=function(){const h=_v7(),s=P.pub;if(!s||!P.joined)return h;
  if(s.ph==="day"&&s.st==="vote"&&P.act&&P.act.k==="vote"){const pl=s.pl||[],vc=s.vc||{},A=pl.filter(p=>p.a),n=Object.keys(vc).length;
   const panel=`<div class="pv2">${n?Object.entries(vc).sort((a,b)=>b[1]-a[1]).map(x=>`<span>${esc((pl.find(p=>p.i===x[0])||{}).n||"?")} <b>${x[1]}</b></span>`).join(""):'<span style="opacity:.7">لا أصوات بعد</span>'}<span style="border-color:#4fa3ff66;color:#9ccfff">${s.vs||0}/${A.length} صوّتوا</span></div>`;
   return h.replace('<div class="pb">','<div class="pb">'+panel)}
  if(s.out&&s.out.length&&/^(day|night)$/.test(s.ph)&&P.role&&h.indexOf('class="pv2"')<0)return h.replace('</h1>','</h1>'+outH(s));
  return h};
}
/* ---------- لوحة المدير: حقل الرسالة + الحفاظ على ما كُتب + تمييز الأزرار ---------- */
if(MODE==="h"){
 let MX="";
 document.addEventListener("input",e=>{if(e.target&&e.target.id==="mx")MX=e.target.value});
 document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target&&e.target.id==="mx"){e.preventDefault();const b=document.querySelector('.hb2[data-a="msnd"]:not(.qk)');b&&b.click()}});
 const _hr7=hRender;hRender=function(){_hr7();const i=$("#mx");if(i&&MX)i.value=MX};
 const _hc7=hClick;hClick=function(e){const b=e.target.closest&&e.target.closest('[data-a="msnd"]');
  if(!b){if(e.target&&e.target.id==="mx")return;return _hc7(e)}
  if(!H.hv)return;const sel=$("#mto"),x=(b.dataset.x||($("#mx")&&$("#mx").value)||"").trim();
  if(!x)return;cmd("mchat",sel&&sel.value?{x,who:sel.value}:{x});const i=$("#mx");if(i)i.value="";MX=""}};
})();
</script>
