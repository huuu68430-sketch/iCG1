<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iCG1 – لوحة العضو</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g1:#f4d495;--g2:#c9953f;--g3:#7b5324;--ink:#070403;--glass:rgba(26,17,10,.62);--ln:rgba(244,212,149,.2);--txt:#f7ecd6;--mut:#a39078;--ok:#2fd27a;--bad:#ff5d4d;--ice:#79e6ff;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--txt);font-family:Tajawal,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--g1);outline-offset:3px}
.bg{position:fixed;inset:0;background:linear-gradient(180deg,rgba(7,4,3,.55),rgba(7,4,3,.92)),url(assets/bg.png) center/cover;z-index:-3}
.aur{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.aur i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.34;animation:fl 18s ease-in-out infinite alternate}
.aur i:nth-child(1){width:46vmax;height:46vmax;background:#b8782a;top:-18vmax;right:-10vmax}
.aur i:nth-child(2){width:38vmax;height:38vmax;background:#7a2f18;bottom:-16vmax;left:-8vmax;animation-delay:-6s}
.aur i:nth-child(3){width:26vmax;height:26vmax;background:#1d6d86;top:40%;left:35%;opacity:.14;animation-delay:-11s}
@keyframes fl{to{transform:translate(6vmax,5vmax) scale(1.2)}}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(244,212,149,.025) 0 1px,transparent 1px 80px),repeating-linear-gradient(0deg,rgba(244,212,149,.025) 0 1px,transparent 1px 80px);-webkit-mask:radial-gradient(ellipse at 50% 30%,#000,transparent 75%);mask:radial-gradient(ellipse at 50% 30%,#000,transparent 75%)}
body.calm *{animation-duration:.01ms!important;transition-duration:.01ms!important}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}

/* dock */
.dock{position:sticky;top:12px;z-index:30;width:min(1220px,calc(100% - 24px));margin:12px auto 0;display:flex;align-items:center;gap:14px;padding:9px 12px;border-radius:22px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px);border:1px solid var(--ln);box-shadow:0 16px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:10px;font-family:Lalezar;font-size:24px;letter-spacing:.04em;direction:ltr}
.brand img{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 1px var(--ln),0 0 20px rgba(201,149,63,.4)}
.nav{display:flex;gap:4px;margin-inline:auto;padding:4px;border-radius:16px;background:rgba(0,0,0,.35);position:relative}
.nav a{position:relative;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;font-weight:700;font-size:14px;color:var(--mut);text-decoration:none;transition:.3s var(--ease)}
.nav a:hover{color:var(--txt)}
.nav a.on{color:#1d1106;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 6px 20px rgba(201,149,63,.4)}
.nav .i{font-size:17px}
.chips{display:flex;align-items:center;gap:10px}
.chip{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:14px;background:rgba(0,0,0,.4);border:1px solid var(--ln);font-weight:800;transition:.3s var(--ease)}
.chip:hover{border-color:var(--g1);transform:translateY(-2px)}
.chip .i{color:var(--g1);font-size:18px}
.mini{width:44px;height:44px}

/* frames */
.fr{--s:96px;--c1:#c9953f;--c2:#f4d495;position:relative;width:var(--s);height:var(--s);display:grid;place-items:center;flex:none}
.fr .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from var(--a,0deg),var(--c1),var(--c2),var(--c1),var(--c2),var(--c1));-webkit-mask:radial-gradient(circle,transparent calc(50% - max(4px,calc(var(--s)*.07))),#000 calc(50% - max(4px,calc(var(--s)*.07)) + 1px));mask:radial-gradient(circle,transparent calc(50% - max(4px,calc(var(--s)*.07))),#000 calc(50% - max(4px,calc(var(--s)*.07)) + 1px));filter:drop-shadow(0 0 calc(var(--s)*.1) var(--c1))}
.fr.spin .ring{animation:ang 6s linear infinite}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes ang{to{--a:360deg}}
.fr::after{content:"";position:absolute;top:calc(var(--s)*-.04);left:50%;width:calc(var(--s)*.14);height:calc(var(--s)*.14);translate:-50% 0;rotate:45deg;background:linear-gradient(135deg,#fff,var(--c2));box-shadow:0 0 calc(var(--s)*.14) var(--c2);border-radius:2px}
.fr.none::after{display:none}
.fr .av{width:calc(100% - max(10px,calc(var(--s)*.17)));height:calc(100% - max(10px,calc(var(--s)*.17)));border-radius:50%;display:grid;place-items:center;font-family:Lalezar;font-size:calc(var(--s)*.3);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);background:var(--avg)}

/* layout */
main{width:min(1220px,calc(100% - 24px));margin:22px auto 110px}
.pg{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.pg>*{animation:up .7s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes up{from{opacity:0;transform:translateY(24px) scale(.98)}}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card{position:relative;overflow:hidden;border-radius:26px;padding:22px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--ln);box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);transition:.4s var(--ease)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0),rgba(244,212,149,.16),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::before{opacity:1}
.card h2{font-size:18px;font-weight:800;display:flex;align-items:center;gap:9px;margin-bottom:16px}
.card h2 .i{color:var(--g1);font-size:20px}
.ttl{font-family:Lalezar;font-size:clamp(34px,6vw,54px);line-height:1.1;display:inline-block;transform:skewX(-6deg);background:linear-gradient(100deg,#9a948b,#fff 35%,#d4cdc2 55%,#fff 70%,#9a948b);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
.eyb{font-size:12px;color:var(--g2);letter-spacing:.3em;font-weight:800;direction:ltr;margin-top:4px}
.mut{color:var(--mut);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:14px;font-weight:800;font-size:15px;transition:.3s var(--ease);position:relative;overflow:hidden}
.gold{background:linear-gradient(135deg,var(--g1),var(--g2) 60%,#98682b);color:#1d1106;box-shadow:0 8px 26px rgba(201,149,63,.35)}
.gold:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(201,149,63,.5)}
.gold:active{transform:scale(.97)}
.gold::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);translate:-120%;transition:translate .7s}
.gold:hover::after{translate:120%}
.ghost{background:rgba(255,255,255,.06);border:1px solid var(--ln)}
.ghost:hover{border-color:var(--g1);transform:translateY(-2px)}
.btn[disabled]{opacity:.55;pointer-events:none}
.danger{color:var(--bad);border-color:rgba(255,93,77,.4);background:rgba(255,93,77,.08)}

/* hero */
.hero{display:flex;align-items:center;gap:26px;min-height:230px;background:linear-gradient(120deg,rgba(201,149,63,.28),rgba(26,17,10,.7) 60%)}
.hero .tx{flex:1;min-width:0}
.rk{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px;color:var(--g1);border:1px solid var(--g2);background:rgba(201,149,63,.14);margin:10px 0 14px}
.xp{height:10px;border-radius:10px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.xp i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,var(--g3),var(--g1));box-shadow:0 0 16px var(--g2);transition:width 1.4s var(--ease) .3s;position:relative}
.xp i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:sw 2.4s linear infinite}
@keyframes sw{from{translate:-100%}to{translate:100%}}
.xpl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:7px;font-weight:700}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* stats */
.stat{display:flex;flex-direction:column;gap:6px}
.stat .top{display:flex;align-items:center;gap:12px}
.ico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:23px;color:var(--g1);background:linear-gradient(145deg,rgba(201,149,63,.3),rgba(0,0,0,.4));border:1px solid var(--ln)}
.stat b{font-size:34px;font-weight:800;line-height:1}
.stat svg.sp{width:100%;height:46px;margin-top:6px}
.sp path{fill:none;stroke:var(--g1);stroke-width:2;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;animation:dr 2s var(--ease) .4s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.up{color:var(--ok);font-size:12px;font-weight:800;display:inline-flex;gap:4px;align-items:center}

/* daily */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:4px 0 18px}
.day{aspect-ratio:1;border-radius:13px;display:grid;place-items:center;font-size:12px;font-weight:800;background:rgba(0,0,0,.35);border:1px solid var(--ln);color:var(--mut);position:relative;transition:.3s}
.day.done{background:linear-gradient(145deg,var(--g1),var(--g2));color:#1d1106;border-color:transparent}
.day.now{border-color:var(--g1);color:var(--g1);animation:pl 1.8s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px rgba(244,212,149,.14)}}
.day.big{grid-column:span 1;color:var(--ice);border-color:rgba(121,230,255,.4)}

/* lists */
.lst{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid transparent;transition:.3s var(--ease)}
.row:hover{border-color:var(--ln);transform:translateX(-4px)}
.row .ico{width:40px;height:40px;font-size:19px;border-radius:12px}
.row div{flex:1;min-width:0}.row b{display:block;font-size:14px}.row small{color:var(--mut);font-size:12px}
.row em{font-style:normal;font-weight:800;color:var(--g1);direction:ltr}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.q .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}
.q .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g3),var(--g1));border-radius:6px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.bd{text-align:center;padding:16px 8px;border-radius:18px;background:rgba(0,0,0,.3);border:1px solid var(--ln);transition:.3s var(--ease)}
.bd:hover{transform:translateY(-5px)}
.bd .ico{margin:0 auto 9px}.bd b{font-size:13px;display:block}.bd small{font-size:11px;color:var(--mut)}
.bd.lk{opacity:.45;filter:grayscale(1)}

/* page head */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;grid-column:1/-1}
.bal{display:flex;align-items:center;gap:12px;padding:10px 18px 10px 14px;border-radius:18px;background:var(--glass);border:1px solid var(--ln)}
.bal .ico{width:42px;height:42px;background:linear-gradient(145deg,var(--g1),var(--g2));color:#1d1106}
.bal small{display:block;color:var(--mut);font-size:11px}.bal b{font-size:22px}
.flt{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1;margin-bottom:4px}
.fc{padding:9px 18px;border-radius:999px;font-weight:700;font-size:13px;background:rgba(0,0,0,.35);border:1px solid var(--ln);color:var(--mut);transition:.3s var(--ease)}
.fc:hover{color:var(--txt)}.fc.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#1d1106;border-color:transparent}

/* store */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px;grid-column:1/-1}
.grid>*{animation:up .6s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.it{text-align:center;padding:26px 16px 18px;border-color:color-mix(in srgb,var(--rc) 45%,transparent)}
.it:hover{transform:translateY(-8px);box-shadow:0 26px 60px rgba(0,0,0,.5),0 0 40px color-mix(in srgb,var(--rc) 25%,transparent)}
.it .fr{margin:6px auto 16px;--s:112px}
.it h3{font-size:18px;font-weight:800;color:var(--rc)}
.it p{font-size:12.5px;color:var(--mut);margin:6px 0 16px;min-height:36px}
.rar{position:absolute;top:12px;inset-inline-start:12px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;color:var(--rc);background:rgba(0,0,0,.5);border:1px solid color-mix(in srgb,var(--rc) 50%,transparent)}
.buy{width:100%;height:44px;border-radius:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;color:#14090a;background:linear-gradient(135deg,color-mix(in srgb,var(--rc) 80%,#fff),var(--rc));transition:.3s var(--ease)}
.buy:hover{transform:translateY(-2px);filter:brightness(1.1)}
.buy.dim{filter:saturate(.3) brightness(.8)}
.buy.own{background:rgba(255,255,255,.08);color:var(--txt);border:1px solid var(--ln)}
.buy.eq{background:rgba(47,210,122,.14);color:var(--ok);border:1px solid rgba(47,210,122,.5);pointer-events:none}

/* ranks */
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end;grid-column:1/-1;margin:6px 0 8px}
.pd{text-align:center;padding:20px 10px 18px;border-radius:26px 26px 18px 18px;background:var(--glass);border:1px solid var(--ln);position:relative}
.pd.p1{padding-bottom:34px;background:linear-gradient(180deg,rgba(244,212,149,.26),var(--glass));border-color:var(--g1);box-shadow:0 0 50px rgba(201,149,63,.28)}
.pd .fr{margin:0 auto 10px;--s:84px}.pd.p1 .fr{--s:104px}
.pd .cr{font-size:30px;color:var(--g1);position:absolute;top:-22px;left:50%;translate:-50%;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 0 10px var(--g2))}
@keyframes bob{50%{translate:-50% -6px}}
.pd b{display:block;font-size:16px}.pd em{font-style:normal;font-weight:800;color:var(--g1)}
.pd .n{position:absolute;top:10px;inset-inline-end:12px;font-family:Lalezar;font-size:26px;opacity:.35}
.rl{grid-column:1/-1}
.rr{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:16px;background:rgba(0,0,0,.28);margin-bottom:8px;border:1px solid transparent;transition:.3s var(--ease)}
.rr:hover{transform:translateX(-4px);border-color:var(--ln)}
.rr.me{background:linear-gradient(90deg,rgba(201,149,63,.3),rgba(0,0,0,.28));border-color:var(--g2)}
.rr .no{width:34px;font-weight:800;text-align:center;color:var(--mut);font-size:16px}
.rr .fr{--s:42px}.rr b{flex:1;font-size:15px}.rr .pw{width:30%;height:6px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.rr .pw i{display:block;height:100%;background:linear-gradient(90deg,var(--g3),var(--g1))}
.rr em{font-style:normal;font-weight:800;min-width:70px;text-align:left;direction:ltr}

/* settings */
.fld{display:block;margin-bottom:16px}.fld>span{display:block;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:7px}
.inp{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border-radius:14px;background:rgba(0,0,0,.45);border:1px solid var(--ln);transition:.3s var(--ease)}
.inp:focus-within{border-color:var(--g1);box-shadow:0 0 0 4px rgba(244,212,149,.12)}
.inp input{flex:1;background:none;border:0;outline:0;min-width:0;height:100%}
.inp.lkd{opacity:.65}.inp .i{color:var(--g1);font-size:19px}
.avs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.avo{width:50px;height:50px;border-radius:50%;border:2px solid transparent;transition:.3s var(--ease)}
.avo:hover{transform:scale(1.12)}.avo.on{border-color:#fff;box-shadow:0 0 0 3px var(--g2)}
.tg{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln)}
.tg:last-child{border:0}.tg div{flex:1}.tg b{display:block;font-size:14px}.tg small{color:var(--mut);font-size:12px}
.sw{width:50px;height:28px;border-radius:20px;background:rgba(255,255,255,.12);position:relative;transition:.3s var(--ease);flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.35s var(--ease)}
.sw.on{background:linear-gradient(135deg,var(--g1),var(--g2))}.sw.on::after{translate:-22px 0;background:#1d1106}
.sess{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(47,210,122,.1);border:1px solid rgba(47,210,122,.35);color:var(--ok);font-weight:800;font-size:13px;margin-bottom:14px}
.sess i{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pl 1.6s infinite;box-shadow:0 0 0 0 rgba(47,210,122,.5)}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;border-radius:26px;border:1.5px dashed var(--ln)}
.empty .ico{width:80px;height:80px;margin:0 auto 16px;font-size:38px;border-radius:24px}

/* mobile tabs, modal, toast */
.tabs{display:none}
#toast{position:fixed;top:84px;left:50%;translate:-50% -200%;z-index:80;display:flex;gap:10px;align-items:center;padding:13px 20px;border-radius:15px;font-weight:700;font-size:14px;background:rgba(20,12,7,.95);border:1px solid var(--g2);backdrop-filter:blur(12px);transition:translate .5s var(--ease);box-shadow:0 16px 40px rgba(0,0,0,.6);max-width:calc(100% - 28px)}
#toast.show{translate:-50% 0}#toast.bad{border-color:var(--bad)}#toast.ok{border-color:var(--ok)}
#md{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);padding:20px}
#md.on{display:grid;animation:fi .3s}
@keyframes fi{from{opacity:0}}
#md .box{width:min(420px,100%);text-align:center;animation:up .5s var(--ease)}
#md .ico{width:64px;height:64px;margin:0 auto 14px;font-size:30px}
#md .acts{justify-content:center}
@media(max-width:940px){.s4,.s5,.s6,.s7,.s8{grid-column:span 12}.nav{display:none}.hero{flex-direction:column;text-align:center}.acts{justify-content:center}
 .dock{top:8px;margin-top:8px}.brand span{display:none}.chips{margin-inline-start:auto}
 .tabs{display:flex;position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;translate:-50%;z-index:40;width:min(440px,calc(100% - 20px));padding:7px;border-radius:24px;background:rgba(18,11,6,.88);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--ln);box-shadow:0 18px 50px rgba(0,0,0,.7)}
 .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;border-radius:18px;color:var(--mut);font-size:10.5px;font-weight:800;text-decoration:none;transition:.4s var(--ease)}
 .tabs a .i{font-size:22px;transition:.4s var(--ease)}
 .tabs a.on{color:#1d1106;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 6px 20px rgba(201,149,63,.45)}
 .tabs a.on .i{transform:translateY(-2px) scale(1.12)}
 main{margin-bottom:120px}
 .rr .pw{display:none}.pod{gap:8px}.pd{padding:16px 4px 14px}.pd .fr{--s:60px}.pd.p1 .fr{--s:76px}.pd b{font-size:13px}.pd .n{display:none}
 .grid{grid-template-columns:repeat(2,1fr);gap:11px}.it{padding:22px 10px 14px}.it .fr{--s:88px}.it h3{font-size:15px}.it p{display:none}
 .ach{grid-template-columns:repeat(3,1fr)}.card{padding:18px;border-radius:22px}.chip.pts span{display:inline}}
@media(max-width:380px){.ach{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<script>
/* بيانات وهمية للمعاينة – استبدلها ببيانات الباكند */
const $=(s,r=document)=>r.querySelector(s);
const I=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const fmt=n=>Math.round(n).toLocaleString('en-US');
const AVG=['linear-gradient(145deg,#0f2a5a,#3b7bd4)','linear-gradient(145deg,#4a1d6e,#d46bff)','linear-gradient(145deg,#6b1a12,#ff7a45)','linear-gradient(145deg,#0d4d3a,#35d09a)','linear-gradient(145deg,#5a4210,#f2c15a)','linear-gradient(145deg,#222,#777)'];
const RAR={c:['عادي','#bdb5a8'],r:['نادر','#6cb8ff'],e:['ملحمي','#c58bff'],l:['أسطوري','#ffc04d']};
const FRAMES=[
 {id:'free',n:'الإطار الأساسي',d:'إطار مجاني لكل عضو جديد',p:0,r:'c',a:'#8f877a',b:'#d9d0c0'},
 {id:'ramadan',n:'إطار رمضان',d:'إطار رمضاني رخيص',p:50,r:'r',a:'#3f8fd9',b:'#f6c75e'},
 {id:'dark',n:'إطار الظلام',d:'إطار الغموض المرعب',p:1500,r:'r',a:'#4a4a55',b:'#b5b0c8'},
 {id:'crown',n:'تاج الملوك',d:'تاج الملوك الذهبي',p:5000,r:'e',a:'#e0a21a',b:'#d6322f'},
 {id:'galaxy',n:'إطار المجرة',d:'يعكس اتساع الكون والفضاء',p:5500,r:'l',a:'#7b4dff',b:'#ff5fb7'},
 {id:'fire',n:'إطار النيران',d:'إطار محاط بلهيب لا ينطفئ',p:6000,r:'e',a:'#ff5a1f',b:'#ffc23a'},
 {id:'crystal',n:'إطار الكريستال',d:'كريستال وردي لامع يخطف الأنظار',p:6000,r:'e',a:'#46e3ff',b:'#c84dff'},
 {id:'bunny',n:'إطار بكمي',d:'ياقوت أحمر خالص ونادر',p:6500,r:'l',a:'#ff4d7a',b:'#ffd0e0'},
 {id:'diamond',n:'الإطار الماسي',d:'إطار الألماس النادر والمبهر',p:8000,r:'l',a:'#4fd6ff',b:'#3a6bff'},
 {id:'gold',n:'الإطار الذهبي',d:'إطار الذهب الفاخر للأعضاء المتألقين',p:9000,r:'l',a:'#ffcf3a',b:'#ff8a1f'}];
const RANKS=[[0,'مستجد'],[100,'جندي'],[300,'عريف'],[600,'رقيب'],[1000,'ملازم'],[1600,'ملازم أول'],[2400,'نقيب'],[3500,'رائد'],[5000,'مقدم'],[8000,'عقيد']];
const OTHERS=[['Z_Ghost',9840],['أبو سلطان',8120],['LunaKick',6450],['ملك_الحروف',5230],['Noor77',4380],['صقر',3510],['Mr.Bomb',2960],['ريماس',2210],['حمودي',1740],['K1NG',1280],['Sky',860]];
const S=Object.assign({name:'HSG',kick:'hsg2',pts:2775,own:['free','ramadan'],eq:'ramadan',av:0,streak:3,claimed:false,buys:2,o:{sound:1,calm:0,notif:1,hide:0}},(()=>{try{return JSON.parse(localStorage.icg1m||'{}')}catch(e){return{}}})());
const save=()=>{try{localStorage.icg1m=JSON.stringify(S)}catch(e){}};
const frame=(id,s,txt,spin)=>{const f=FRAMES.find(x=>x.id===id);return `<div class="fr ${spin?'spin':''} ${id==='free'?'none':''}" style="--s:${s}px;--c1:${f.a};--c2:${f.b};--avg:${AVG[S.av]}"><div class="ring"></div><div class="av">${txt}</div></div>`};
const mine=(s,spin)=>frame(S.eq,s,S.name.slice(0,3).toUpperCase(),spin);
const rankOf=p=>{let r=0;RANKS.forEach((x,i)=>p>=x[0]&&(r=i));return r};
const board=f=>[...OTHERS.map(o=>({n:o[0],p:o[1]*f,id:FRAMES[(o[1]%9)+1].id,av:o[1]%6})),{n:S.name,p:S.pts*f,me:1,id:S.eq,av:S.av}].filter(x=>x.me||!S.o.hide||1).sort((a,b)=>b.p-a.p);
const myPos=()=>board(1).findIndex(x=>x.me)+1;

/* واجهة عامة */
const PAGES={home:['الرئيسية','home'],store:['المتجر','bag'],locker:['الخزانة','box'],rank:['الصدارة','trophy'],settings:['الإعدادات','set']};
$('#nav').innerHTML=Object.entries(PAGES).map(([k,v])=>`<a href="#${k}" data-p="${k}">${I(v[1])}${v[0]}</a>`).join('');
$('#tabs').innerHTML=Object.entries(PAGES).map(([k,v])=>`<a href="#${k}" data-p="${k}">${I(v[1])}${v[0]}</a>`).join('');
function dockUp(){$('#dpts').textContent=fmt(S.pts);$('#dav').innerHTML=`<div class="mini">${mine(44)}</div>`}
function toast(m,t){const e=$('#toast');e.className='show '+(t||'');e.innerHTML=I(t==='bad'?'x':'check')+m;clearTimeout(toast.h);toast.h=setTimeout(()=>e.className='',2800)}
function modal(ic,t,p,okTxt,fn,danger){const m=$('#md');m.innerHTML=`<div class="card box"><div class="ico">${I(ic)}</div><h2 style="justify-content:center;font-size:22px">${t}</h2><p class="mut" style="margin-bottom:20px">${p}</p><div class="acts"><button class="btn ${danger?'danger':'gold'}" id="mok">${okTxt}</button><button class="btn ghost" id="mno">إلغاء</button></div></div>`;m.classList.add('on');$('#mno').onclick=()=>m.classList.remove('on');$('#mok').onclick=()=>{m.classList.remove('on');fn()};m.onclick=e=>e.target===m&&m.classList.remove('on')}
/* جزيئات الاحتفال */
const cv=$('#fx'),cx=cv.getContext('2d');let ps=[];const rs=()=>{cv.width=innerWidth;cv.height=innerHeight};rs();addEventListener('resize',rs);
function burst(x,y,n=60){if(S.o.calm)return;for(let i=0;i<n;i++){const a=Math.random()*7,v=Math.random()*7+2;ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,l:1,c:['#f4d495','#c9953f','#fff','#ff8a1f'][i%4],s:Math.random()*5+2})}if(ps.length===n)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(p=>p.l>0);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.l-=.014;cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s*1.6)});if(ps.length)requestAnimationFrame(loop);else cx.clearRect(0,0,cv.width,cv.height)}
const ctr=e=>{const r=e.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.card');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')}});

/* الصفحات */
const spark=()=>{let y=36,d='M0 36';for(let i=1;i<=10;i++){y=Math.max(6,Math.min(40,y+(Math.random()*18-11)));d+=` L${i*30} ${y.toFixed(0)}`}return `<svg class="sp" viewBox="0 0 300 46" preserveAspectRatio="none"><path d="${d}"/></svg>`};
const REW=[20,30,40,60,80,100,250];
const ACH=()=>[['أول عملية شراء','bag',S.buys>=1],['1,000 نقطة','gem',S.pts>=1000],['نخبة المتصدرين','trophy',myPos()<=5],['7 أيام متتالية','flame',S.streak>=7],['ملك الإطارات','crown',S.own.some(i=>FRAMES.find(f=>f.id===i).r==='l')],['عضو منذ البداية','shield',true]];
const pages={
home(){const r=rankOf(S.pts),nx=RANKS[r+1]||RANKS[r],pr=Math.min(100,(S.pts-RANKS[r][0])/Math.max(1,nx[0]-RANKS[r][0])*100),top=board(1).slice(0,3);
return `<div class="pg">
<div class="card hero s8" style="--i:0">${mine(150,1)}<div class="tx"><div class="mut" style="letter-spacing:.3em;font-weight:800;direction:ltr">MEMBER DASHBOARD</div><h1 class="ttl">أهلاً بك، ${S.name}</h1><div class="rk">${I('medal')} الرتبة: ${RANKS[r][1]}</div>
<div class="xp"><i data-w="${pr}"></i></div><div class="xpl"><span>${fmt(S.pts)} نقطة</span><span>${r<9?'الرتبة القادمة: '+nx[1]+' ('+fmt(nx[0])+')':'أعلى رتبة'}</span></div>
<div class="acts"><a class="btn gold" href="#store">${I('bag')} تصفّح المتجر</a><a class="btn ghost" href="#rank">${I('trophy')} لوحة الصدارة</a></div></div></div>
<div class="card s4" style="--i:1"><h2>${I('gift')} المكافأة اليومية</h2><div class="days">${REW.map((v,i)=>`<div class="day ${i<S.streak?'done':i===S.streak&&!S.claimed?'now':''} ${i===6?'big':''}">${i<S.streak?I('check'):v}</div>`).join('')}</div>
<button class="btn gold" style="width:100%" data-a="claim" ${S.claimed?'disabled':''}>${S.claimed?'تم الاستلام – عد غداً':'استلم +'+REW[S.streak%7]+' نقطة'}</button></div>
<div class="card stat s4" style="--i:2"><div class="top"><div class="ico">${I('wallet')}</div><div><span class="mut">إجمالي النقاط</span><br><b data-n="${S.pts}">0</b></div></div>${spark()}<span class="up">${I('up')} +12% هذا الأسبوع</span></div>
<div class="card stat s4" style="--i:3"><div class="top"><div class="ico">${I('trophy')}</div><div><span class="mut">المرتبة الحالية</span><br><b>#${myPos()}</b></div></div>${spark()}<span class="up">${I('up')} تقدّمت ${2} مراكز</span></div>
<div class="card stat s4" style="--i:4"><div class="top"><div class="ico">${I('bag')}</div><div><span class="mut">عدد المشتريات</span><br><b data-n="${S.buys}">0</b></div></div>${spark()}<span class="up">${I('gem')} ${S.own.length} إطار في الخزانة</span></div>
<div class="card s7" style="--i:5"><h2>${I('bolt')} آخر النشاطات</h2><div class="lst">
${[['gift','مكافأة يومية','قبل ساعتين','+40','pos'],['bag','شراء إطار رمضان','أمس','-50','neg'],['bolt','فزت في لعبة حروف مع منصور','أمس','+120','pos'],['bolt','لعبة البنك الآمن','قبل يومين','+85','pos'],['trophy','تقدّمت في لوحة الصدارة','قبل 3 أيام','#'+myPos(),'']].map(a=>`<div class="row"><div class="ico">${I(a[1])}</div><div><b>${a[1]}</b><small>${a[2]}</small></div><em class="${a[4]}">${a[3]}</em></div>`).join('')}</div></div>
<div class="card s5" style="--i:6"><h2>${I('crown')} أفضل 3 الآن</h2><div class="lst">${top.map((u,i)=>`<div class="row"><div class="ico" style="font-family:Lalezar;font-size:22px">${i+1}</div><div><b>${u.n}</b><small>${fmt(u.p)} نقطة</small></div>${frame(u.id,40,u.n[0].toUpperCase())}</div>`).join('')}</div><a class="btn ghost" href="#rank" style="width:100%;margin-top:14px">عرض الكل</a></div>
<div class="card s5 q" style="--i:7"><h2>${I('target')} مهام اليوم</h2><div class="lst">${[['العب 3 ألعاب',2,3],['أرسل 20 رسالة في الشات',14,20],['استلم المكافأة اليومية',S.claimed?1:0,1]].map(q=>`<div class="row"><div><b>${q[0]}</b><div class="bar"><i style="width:${q[1]/q[2]*100}%"></i></div></div><em>${q[1]}/${q[2]}</em></div>`).join('')}</div></div>
<div class="card s7" style="--i:8"><h2>${I('medal')} الإنجازات</h2><div class="ach">${ACH().map(a=>`<div class="bd ${a[2]?'':'lk'}"><div class="ico">${I(a[1])}</div><b>${a[0]}</b><small>${a[2]?'مفتوح':'مقفل'}</small></div>`).join('')}</div></div></div>`},
store(){const f=S.f||'all',L=FRAMES.filter(x=>f==='all'||(f==='free'?x.p===0:x.r===f));
return `<div class="pg"><div class="head"><div><h1 class="ttl">المتجر الحصري</h1><div class="eyb">PREMIUM SKINS & ITEMS</div></div><div class="bal"><div class="ico">${I('gem')}</div><div><small>رصيدك الحالي</small><b>${fmt(S.pts)}</b></div></div></div>
<div class="flt">${[['all','الكل'],['free','مجاني'],['r','نادر'],['e','ملحمي'],['l','أسطوري']].map(c=>`<button class="fc ${f===c[0]?'on':''}" data-a="flt" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>
<div class="grid">${L.map((x,i)=>{const o=S.own.includes(x.id),e=S.eq===x.id;return `<div class="card it" style="--rc:${RAR[x.r][1]};--i:${i}"><span class="rar">${RAR[x.r][0]}</span>${frame(x.id,112,S.name.slice(0,3).toUpperCase(),x.r==='l'||x.r==='e')}<h3>${x.n}</h3><p>${x.d}</p>
${e?`<button class="buy eq">${I('check')} مجهّز</button>`:o?`<button class="buy own" data-a="eq" data-v="${x.id}">${I('user')} تجهيز</button>`:`<button class="buy ${S.pts<x.p?'dim':''}" data-a="buy" data-v="${x.id}">${I(S.pts<x.p?'lock':'bag')} ${x.p?fmt(x.p)+' نقطة':'مجاني'}</button>`}</div>`}).join('')}</div></div>`},
locker(){const L=FRAMES.filter(x=>S.own.includes(x.id));
return `<div class="pg"><div class="head"><div><h1 class="ttl">الخزانة الخاصة</h1><div class="eyb">MY COLLECTION / INVENTORY</div></div><div class="bal"><div class="ico">${I('box')}</div><div><small>مجموعتك</small><b>${L.length}/${FRAMES.length}</b></div></div></div>
${L.length?`<div class="grid">${L.map((x,i)=>`<div class="card it" style="--rc:${RAR[x.r][1]};--i:${i}"><span class="rar">${RAR[x.r][0]}</span>${frame(x.id,112,S.name.slice(0,3).toUpperCase(),x.r==='l'||x.r==='e')}<h3>${x.n}</h3><p>${x.d}</p>${S.eq===x.id?`<button class="buy eq">${I('check')} مجهّز</button>`:`<button class="buy own" data-a="eq" data-v="${x.id}">${I('user')} تجهيز</button>`}</div>`).join('')}</div>`:`<div class="empty"><div class="ico">${I('box')}</div><h2 style="justify-content:center">خزانتك فارغة</h2><p class="mut" style="margin:6px 0 18px">توجه إلى المتجر للحصول على الإطارات والمميزات الحصرية.</p><a class="btn gold" href="#store">${I('bag')} إلى المتجر</a></div>`}</div>`},
rank(){const f=S.t||1,B=board(f),mx=B[0].p,p=[B[1],B[0],B[2]];
return `<div class="pg"><div class="head"><div><h1 class="ttl">لوحة الصدارة</h1><div class="eyb">GLOBAL MEMBER RANKINGS</div></div><div class="bal"><div class="ico">${I('trophy')}</div><div><small>مرتبتك</small><b>#${B.findIndex(x=>x.me)+1}</b></div></div></div>
<div class="flt">${[[.15,'هذا الأسبوع'],[.4,'هذا الشهر'],[1,'كل الأوقات']].map(c=>`<button class="fc ${f===c[0]?'on':''}" data-a="tab" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>
<div class="pod">${p.map((u,i)=>{const n=[2,1,3][i];return `<div class="pd p${n}" style="--i:${n}">${n===1?`<div class="cr">${I('crown')}</div>`:''}<span class="n">${n}</span>${frame(u.id,84,u.n[0].toUpperCase(),n===1)}<b>${u.n}</b><em>${fmt(u.p)}</em></div>`}).join('')}</div>
<div class="rl">${B.slice(3).map((u,i)=>`<div class="rr ${u.me?'me':''}" style="animation:up .5s var(--ease) both;animation-delay:${i*40}ms"><span class="no">${i+4}</span>${frame(u.id,42,u.n[0].toUpperCase())}<b>${u.n}${u.me?' (أنت)':''}</b><div class="pw"><i style="width:${u.p/mx*100}%"></i></div><em>${fmt(u.p)}</em></div>`).join('')}</div></div>`},
settings(){const sw=(k,t,d,ic)=>`<div class="tg"><div class="ico" style="width:40px;height:40px;font-size:19px">${I(ic)}</div><div><b>${t}</b><small>${d}</small></div><button class="sw ${S.o[k]?'on':''}" data-a="tg" data-v="${k}" aria-label="${t}"></button></div>`;
return `<div class="pg"><div class="head"><div><h1 class="ttl">إعدادات الحساب</h1><div class="eyb">PROFILE & SECURITY SETTINGS</div></div></div>
<div class="card s7" style="--i:1"><h2>${I('user')} المعلومات الشخصية</h2><div style="display:flex;gap:20px;align-items:center;margin-bottom:20px">${mine(90,1)}<div><b style="font-size:20px">${S.name}</b><div class="mut">اختر لون صورتك</div></div></div>
<div class="avs">${AVG.map((g,i)=>`<button class="avo ${S.av===i?'on':''}" style="background:${g}" data-a="av" data-v="${i}" aria-label="لون ${i+1}"></button>`).join('')}</div>
<label class="fld"><span>الاسم المعروض</span><div class="inp">${I('user')}<input id="nm" value="${S.name}" maxlength="16"></div></label>
<label class="fld"><span>حساب Kick (لا يمكن تغييره)</span><div class="inp lkd">${I('lock')}<input value="${S.kick}" disabled dir="ltr"></div></label>
<button class="btn gold" style="width:100%" data-a="savenm">${I('check')} حفظ التعديلات</button></div>
<div class="card s5" style="--i:2"><h2>${I('shield')} الأمان والمصادقة</h2><div class="sess"><i></i> ACTIVE SESSION – جلسة نشطة</div><p class="mut" style="margin-bottom:16px">حسابك محمي بنظام ABS للمصادقة المتقدمة. تم ربط جهازك بنجاح.</p>
<div class="acts" style="margin:0"><button class="btn ghost" data-a="out" style="flex:1">${I('out')} تسجيل خروج</button><button class="btn danger" data-a="del" style="flex:1">${I('trash')} حذف الحساب</button></div></div>
<div class="card s12" style="--i:3"><h2>${I('set')} التفضيلات</h2>${sw('sound','المؤثرات الصوتية','أصوات عند الشراء والمكافآت','vol')}${sw('notif','الإشعارات','تنبيهات المكافآت والصدارة','bell')}${sw('calm','تقليل الحركة','إيقاف الأنيميشن والتأثيرات','wand')}${sw('hide','إخفاء ملفي من الصدارة','لن يظهر اسمك للأعضاء الآخرين','eye')}</div></div>`}};
/* التحكم */
let cur='home';const A=$('#app');
function render(){cur=PAGES[location.hash.slice(1)]?location.hash.slice(1):'home';A.innerHTML=pages[cur]();document.querySelectorAll('[data-p]').forEach(a=>a.classList.toggle('on',a.dataset.p===cur));dockUp();document.body.classList.toggle('calm',!!S.o.calm);
 requestAnimationFrame(()=>{A.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%');A.querySelectorAll('[data-n]').forEach(e=>{const t=+e.dataset.n,s=performance.now();(function f(n){const k=Math.min((n-s)/1100,1);e.textContent=fmt(t*(1-Math.pow(1-k,3)));k<1&&requestAnimationFrame(f)})(s)})})}
addEventListener('hashchange',()=>{render();scrollTo({top:0,behavior:'smooth'})});
A.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==='flt'){S.f=v;render()}
 else if(a==='tab'){S.t=+v;render()}
 else if(a==='buy'){const f=FRAMES.find(x=>x.id===v);if(S.pts<f.p)return toast('نقاطك لا تكفي – ينقصك '+fmt(f.p-S.pts)+' نقطة','bad');
  modal('bag','تأكيد الشراء',`شراء «${f.n}» مقابل ${fmt(f.p)} نقطة؟`,'اشترِ الآن',()=>{S.pts-=f.p;S.own.push(f.id);S.eq=f.id;S.buys++;save();render();toast('تم الشراء وتجهيز '+f.n,'ok');burst(innerWidth/2,innerHeight/2,90)})}
 else if(a==='eq'){S.eq=v;save();render();toast('تم تجهيز الإطار','ok');burst(...ctr(b),30)}
 else if(a==='claim'){const r=REW[S.streak%7];S.pts+=r;S.streak=Math.min(S.streak+1,7);S.claimed=true;save();burst(...ctr(b),80);render();toast('حصلت على +'+r+' نقطة','ok')}
 else if(a==='av'){S.av=+v;save();render()}
 else if(a==='tg'){S.o[v]=S.o[v]?0:1;save();render()}
 else if(a==='savenm'){const n=$('#nm').value.trim();if(n.length<2)return toast('الاسم قصير جداً','bad');S.name=n;save();render();toast('تم حفظ التعديلات','ok')}
 else if(a==='out')modal('out','تسجيل الخروج','هل تريد إنهاء الجلسة الحالية؟','خروج',()=>{toast('تم تسجيل الخروج');setTimeout(()=>{/* location.href='icg1-auth.html' */},900)});
 else if(a==='del')modal('trash','حذف الحساب نهائياً','سيتم حذف نقاطك وإطاراتك ولا يمكن التراجع عن ذلك.','حذف نهائي',()=>toast('هذه معاينة فقط – لم يُحذف شيء','bad'),1)});
render();
</script>
</body>
</html>
